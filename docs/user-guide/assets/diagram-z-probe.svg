<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">Z probe touch plate setup</title>
  <desc id="d">Clip on bit, conductive plate on stock top, probe circuit to GRBL PROBE pin</desc>
  <defs>
    <style>
      .bg { fill: #f1f3f5; }
      .lab { font-family: system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; }
      .title { font-size: 18px; font-weight: 700; }
      .tiny { font-size: 12px; fill: #5a6570; }
      .steel { fill: #5c6570; }
      .bit { fill: #2c3e50; }
      .plate { fill: #b85c2a; }
      .stock { fill: #d4a574; stroke: #8a5a2b; stroke-width: 1.5; }
      .bed { fill: #cfd6dd; stroke: #7a8694; stroke-width: 1.5; }
      .wire { stroke: #1f6a4a; stroke-width: 2.5; fill: none; }
      .clip { fill: #1f6a4a; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="800" height="400" rx="10"/>
  <text class="lab title" x="28" y="36">Z probe — clip, plate, stock</text>
  <text class="tiny" x="28" y="56">Side view of a typical touch-plate setup</text>

  <rect class="bed" x="56" y="280" width="300" height="32" rx="3"/>
  <text class="tiny" x="56" y="336">Machine bed / table</text>
  <rect class="stock" x="100" y="220" width="220" height="60" rx="3"/>
  <text class="tiny" x="178" y="256">Stock</text>

  <rect class="plate" x="160" y="204" width="100" height="16" rx="2"/>
  <text class="lab" x="276" y="216" font-weight="700">Plate</text>
  <text class="tiny" x="276" y="234">thickness t</text>

  <rect class="steel" x="196" y="80" width="28" height="44" rx="3"/>
  <polygon class="bit" points="210,124 196,204 224,204"/>
  <text class="tiny" x="236" y="112">Bit tip</text>
  <text class="tiny" x="236" y="130">touches plate</text>

  <rect class="clip" x="224" y="156" width="20" height="12" rx="2"/>
  <path class="wire" d="M244 162 C300 162, 330 180, 372 210"/>
  <text class="lab" x="250" y="150" font-weight="700">Clip</text>

  <rect class="box" x="420" y="80" width="340" height="250" rx="12"/>
  <text class="lab" x="444" y="116" font-weight="700">Wiring (typical GRBL)</text>
  <text class="tiny" x="444" y="148">1. Clip → bit (conductive path)</text>
  <text class="tiny" x="444" y="172">2. Plate → probe lead / ground</text>
  <text class="tiny" x="444" y="196">3. Circuit → GRBL PROBE (Uno A5)</text>
  <text class="tiny" x="444" y="220">4. Contact closes pin → G38.2 stops</text>
  <text class="lab" x="444" y="260" font-weight="700">Work Z0</text>
  <text class="tiny" x="444" y="284">After contact on plate top:</text>
  <text class="tiny" x="444" y="304">G10 L20 P1 Zt</text>
  <text class="tiny" x="444" y="324">→ stock top becomes Z0</text>
</svg>
