<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" role="img" aria-labelledby="t d">
  <title id="t">CNC axis directions</title>
  <desc id="d">Top-down square bed with X right, Y back, and Z up inset</desc>
  <defs>
    <style>
      .bg { fill: #f1f3f5; }
      .bed { fill: #d8e0e8; stroke: #3a4550; stroke-width: 2.5; }
      .grid { stroke: #b0bec8; stroke-width: 1; }
      .axis { stroke: #b8862d; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .axis-z { stroke: #1f6a4a; stroke-width: 3.5; fill: none; marker-end: url(#arrowG); }
      .panel { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .home { fill: #3a4550; }
      .lab { font-family: system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; }
      .title { font-size: 18px; font-weight: 700; }
      .big { font-size: 22px; font-weight: 700; fill: #b8862d; }
      .big-g { font-size: 22px; font-weight: 700; fill: #1f6a4a; }
      .tiny { font-size: 12px; fill: #5a6570; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b8862d"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6a4a"/>
    </marker>
  </defs>

  <rect class="bg" width="740" height="500" rx="10"/>
  <text class="lab title" x="28" y="36">Axis directions (looking down on the bed)</text>
  <text class="tiny" x="28" y="56">Expected signs when facing the front of the machine</text>

  <rect class="bed" x="100" y="84" width="300" height="300" rx="8"/>
  <path class="grid" d="M100 159 H400 M100 234 H400 M100 309 H400 M175 84 V384 M250 84 V384 M325 84 V384"/>

  <!-- Axes from origin — labels sit clear of shafts -->
  <line class="axis" x1="124" y1="360" x2="360" y2="360"/>
  <line class="axis" x1="124" y1="360" x2="124" y2="118"/>
  <circle class="home" cx="124" cy="360" r="9"/>

  <text class="big" x="300" y="330">X+</text>
  <text class="big" x="148" y="148">Y+</text>

  <!-- Labels outside bed, clear of strokes -->
  <text class="lab" x="100" y="420" font-weight="700">Home / zero corner</text>
  <text class="tiny" x="100" y="440">Switches on this side</text>
  <text class="tiny" x="280" y="420">X increases to the right</text>
  <text class="tiny" x="40" y="250" transform="rotate(-90 40 250)">Y increases toward the back</text>

  <rect class="panel" x="460" y="110" width="240" height="250" rx="10"/>
  <text class="lab" x="480" y="144" font-weight="700">Side view</text>
  <text class="tiny" x="480" y="166">Tool height</text>
  <line class="axis-z" x1="560" y1="300" x2="560" y2="190"/>
  <circle class="home" cx="560" cy="300" r="8"/>
  <text class="big-g" x="578" y="210">Z+</text>
  <text class="tiny" x="480" y="330">Z+ raises the tool</text>
  <text class="tiny" x="480" y="348">(safer direction)</text>
</svg>
