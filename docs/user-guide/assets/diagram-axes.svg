<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="t d">
  <title id="t">CNC axis directions</title>
  <desc id="d">Top-down bed with X right, Y back, and Z up inset</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .bed { fill: #d7e0e8; stroke: #2c3e50; stroke-width: 2.5; }
      .grid { stroke: #a8b8c8; stroke-width: 1; }
      .axis { stroke: #c45c26; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .axis-z { stroke: #1f6a4a; stroke-width: 3.5; fill: none; marker-end: url(#arrowG); }
      .home { fill: #2c3e50; }
      .lab { font-family: system-ui,Segoe UI,sans-serif; fill: #1a2332; font-size: 15px; }
      .big { font-size: 22px; font-weight: 700; fill: #c45c26; }
      .big-g { font-size: 22px; font-weight: 700; fill: #1f6a4a; }
      .tiny { font-size: 12px; fill: #4a5568; }
      .title { font-size: 18px; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c45c26"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6a4a"/>
    </marker>
  </defs>
  <rect class="bg" width="560" height="420" rx="8"/>
  <text class="lab title" x="28" y="36">Axis directions (looking down on the bed)</text>

  <!-- Bed -->
  <rect class="bed" x="80" y="70" width="300" height="280" rx="6"/>
  <path class="grid" d="M80 140 H380 M80 210 H380 M80 280 H380 M155 70 V350 M230 70 V350 M305 70 V350"/>

  <!-- Origin home -->
  <circle class="home" cx="100" cy="330" r="10"/>
  <text class="lab tiny" x="116" y="335">Home / zero corner</text>
  <text class="lab tiny" x="100" y="352">(switches on this side)</text>

  <!-- X axis -->
  <line class="axis" x1="100" y1="330" x2="340" y2="330"/>
  <text class="big" x="300" y="318">X+</text>
  <text class="lab tiny" x="250" y="368">X increases to the right</text>

  <!-- Y axis -->
  <line class="axis" x1="100" y1="330" x2="100" y2="100"/>
  <text class="big" x="112" y="118">Y+</text>
  <text class="lab tiny" x="28" y="210" transform="rotate(-90 28 210)">Y increases toward the back</text>

  <!-- Z inset -->
  <rect x="410" y="90" width="120" height="200" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text class="lab" x="430" y="118" font-weight="700">Side view</text>
  <line class="axis-z" x1="470" y1="260" x2="470" y2="130"/>
  <text class="big-g" x="484" y="150">Z+</text>
  <circle cx="470" cy="260" r="8" fill="#2c3e50"/>
  <text class="lab tiny" x="428" y="290">Z+ raises the</text>
  <text class="lab tiny" x="428" y="306">tool (safer)</text>
</svg>
