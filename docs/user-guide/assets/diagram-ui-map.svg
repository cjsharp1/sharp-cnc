<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d">
  <title id="t">SharpCNC UI map</title>
  <desc id="d">Layout of header with connection chip, position and safety above the visualizer, and a tall workspace rail</desc>
  <defs>
    <style>
      .bg { fill: #f1f3f5; }
      .panel { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .header { fill: #1a2332; }
      .ess { fill: #e8eef3; stroke: #3a4550; stroke-width: 1.5; }
      .viz { fill: #d8e0e8; stroke: #3a4550; stroke-width: 1.5; }
      .rail { fill: #f7efd9; stroke: #3a4550; stroke-width: 1.5; }
      .tab { fill: #ffffff; stroke: #3a4550; stroke-width: 1.25; }
      .tab-on { fill: #3a4550; }
      .lab { font-family: system-ui, "Segoe UI", sans-serif; fill: #1a2332; }
      .lab-w { fill: #f1f3f5; font-family: system-ui, "Segoe UI", sans-serif; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; fill: #5a6570; }
      .title { font-size: 15px; font-weight: 700; }
      .brand { font-size: 18px; font-weight: 700; fill: #f1f3f5; }
      .callout { fill: #b8862d; }
      .callout-t { fill: #ffffff; font-size: 12px; font-weight: 700; font-family: system-ui, "Segoe UI", sans-serif; }
      .chip { fill: #3d4f63; stroke: #f1f3f5; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="780" height="460" rx="10"/>
  <text class="lab title" x="28" y="30" style="font-size:18px">SharpCNC UI map</text>

  <rect class="panel" x="40" y="48" width="700" height="380" rx="12"/>

  <rect class="header" x="40" y="48" width="700" height="52" rx="12"/>
  <rect class="header" x="40" y="72" width="700" height="28"/>
  <text class="brand" x="60" y="82">SharpCNC</text>
  <rect class="chip" x="178" y="64" width="168" height="26" rx="6"/>
  <text class="lab-w tiny" x="192" y="81">Linked · COM3 · Connect</text>
  <rect x="530" y="64" width="72" height="26" rx="6" fill="#3d4f63" stroke="#f1f3f5" stroke-width="1"/>
  <text class="lab-w tiny" x="548" y="81">v0.2.0</text>
  <rect x="612" y="64" width="88" height="26" rx="6" fill="#3d4f63" stroke="#f1f3f5" stroke-width="1"/>
  <text class="lab-w small" x="634" y="82">Menu</text>

  <rect class="ess" x="56" y="116" width="380" height="72" rx="8"/>
  <text class="lab title" x="72" y="140">Position + Safety</text>
  <rect x="72" y="150" width="140" height="26" rx="5" fill="#fff" stroke="#3a4550"/>
  <text class="lab tiny" x="86" y="167">Work / Machine XYZ</text>
  <rect x="224" y="150" width="192" height="26" rx="5" fill="#fff" stroke="#3a4550"/>
  <text class="lab tiny" x="238" y="167">E-Stop · Hold · Unlock</text>

  <rect class="viz" x="56" y="200" width="380" height="208" rx="8"/>
  <text class="lab title" x="72" y="228">Visualizer</text>
  <text class="lab tiny" x="72" y="248">Bed · stock · toolpath · toolhead</text>
  <rect x="96" y="264" width="300" height="120" rx="4" fill="#c5d4e0" stroke="#3a4550" stroke-width="1"/>
  <text class="lab tiny" x="186" y="294">Machine bed view</text>
  <circle cx="246" cy="340" r="8" fill="#b8862d"/>

  <rect class="rail" x="452" y="116" width="272" height="292" rx="8"/>
  <text class="lab title" x="468" y="144">Workspace (tall)</text>
  <rect class="tab-on" x="468" y="160" width="58" height="26" rx="5"/>
  <text class="lab-w small" x="478" y="178">Move</text>
  <rect class="tab" x="532" y="160" width="58" height="26" rx="5"/>
  <text class="lab small" x="544" y="178">Probe</text>
  <rect class="tab" x="596" y="160" width="50" height="26" rx="5"/>
  <text class="lab small" x="608" y="178">Job</text>
  <rect class="tab" x="652" y="160" width="50" height="26" rx="5"/>
  <text class="lab small" x="664" y="178">Log</text>
  <rect x="468" y="200" width="234" height="72" rx="5" fill="#fff" stroke="#3a4550"/>
  <text class="lab small" x="484" y="230">Jog controls</text>
  <text class="lab tiny" x="484" y="250">above the fold</text>
  <text class="lab tiny" x="468" y="300">Then zeros · home · console</text>
  <text class="lab tiny" x="468" y="322">Rail starts under the header</text>

  <circle class="callout" cx="56" cy="116" r="13"/>
  <text class="callout-t" x="52" y="121">1</text>
  <circle class="callout" cx="56" cy="200" r="13"/>
  <text class="callout-t" x="52" y="205">2</text>
  <circle class="callout" cx="452" cy="116" r="13"/>
  <text class="callout-t" x="448" y="121">3</text>
</svg>
