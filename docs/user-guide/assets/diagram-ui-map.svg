<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d">
  <title id="t">SharpCNC UI map</title>
  <desc id="d">Layout of header, always-on safety strip, visualizer, and phase switcher rail</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .panel { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .header { fill: #1a2332; }
      .ess { fill: #e8eef3; stroke: #3a4550; stroke-width: 1.5; }
      .viz { fill: #d8e0e8; stroke: #3a4550; stroke-width: 1.5; }
      .rail { fill: #f7efd9; stroke: #3a4550; stroke-width: 1.5; }
      .tab { fill: #ffffff; stroke: #3a4550; stroke-width: 1.25; }
      .tab-on { fill: #3a4550; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; }
      .lab-w { fill: #f1f3f5; font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .small { font-size: 12px; }
      .tiny { font-size: 11px; fill: #5a6570; }
      .title { font-size: 15px; font-weight: 700; }
      .brand { font-family: "Oswald", "Arial Narrow", sans-serif; font-size: 18px; font-weight: 700; fill: #f1f3f5; }
      .callout { fill: #b8862d; }
      .callout-t { fill: #ffffff; font-size: 12px; font-weight: 700; font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .chip { fill: #3d4f63; stroke: #f1f3f5; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="780" height="460" rx="10"/>
  <text class="lab title" x="28" y="30" style="font-size:18px">SharpCNC UI map</text>

  <rect class="panel" x="40" y="48" width="700" height="380" rx="12"/>

  <rect class="header" x="40" y="48" width="700" height="52" rx="12"/>
  <rect class="header" x="40" y="72" width="700" height="28"/>
  <text class="brand" x="60" y="82">SharpCNC</text>
  <rect class="chip" x="178" y="64" width="168" height="26" rx="6"/>
  <text class="lab-w tiny" x="262" y="77" text-anchor="middle" dominant-baseline="central">Linked · COM3 · Connect</text>
  <rect x="530" y="64" width="72" height="26" rx="6" fill="#3d4f63" stroke="#f1f3f5" stroke-width="1"/>
  <text class="lab-w tiny" x="566" y="77" text-anchor="middle" dominant-baseline="central">v0.5.0</text>
  <rect x="612" y="64" width="88" height="26" rx="6" fill="#3d4f63" stroke="#f1f3f5" stroke-width="1"/>
  <text class="lab-w small" x="656" y="77" text-anchor="middle" dominant-baseline="central">Menu</text>

  <rect class="ess" x="56" y="116" width="380" height="72" rx="8"/>
  <text class="lab title" x="72" y="140">Safety strip (always on)</text>
  <rect x="72" y="150" width="160" height="26" rx="5" fill="#fff" stroke="#3a4550"/>
  <text class="lab tiny" x="152" y="163" text-anchor="middle" dominant-baseline="central">Material / Machine XYZ</text>
  <rect x="244" y="150" width="172" height="26" rx="5" fill="#fff" stroke="#3a4550"/>
  <text class="lab tiny" x="330" y="163" text-anchor="middle" dominant-baseline="central">E-Stop · Hold · Unlock</text>

  <rect class="viz" x="56" y="200" width="380" height="208" rx="8"/>
  <text class="lab title" x="72" y="228">Visualizer</text>
  <text class="lab tiny" x="72" y="248">Bed · stock · toolpath · Material 0</text>
  <rect x="96" y="264" width="300" height="120" rx="4" fill="#c5d4e0" stroke="#3a4550" stroke-width="1"/>
  <text class="lab tiny" x="246" y="324" text-anchor="middle" dominant-baseline="central">Machine bed view</text>
  <circle cx="246" cy="352" r="8" fill="#b8862d"/>

  <rect class="rail" x="452" y="116" width="272" height="292" rx="8"/>
  <text class="lab title" x="468" y="140">Phase switcher</text>
  <rect class="tab" x="468" y="156" width="48" height="22" rx="4"/>
  <text class="lab tiny" x="492" y="167" text-anchor="middle" dominant-baseline="central">Conn</text>
  <rect class="tab" x="520" y="156" width="48" height="22" rx="4"/>
  <text class="lab tiny" x="544" y="167" text-anchor="middle" dominant-baseline="central">Cal</text>
  <rect class="tab-on" x="572" y="156" width="56" height="22" rx="4"/>
  <text class="lab-w tiny" x="600" y="167" text-anchor="middle" dominant-baseline="central">Prep</text>
  <rect class="tab" x="632" y="156" width="42" height="22" rx="4"/>
  <text class="lab tiny" x="653" y="167" text-anchor="middle" dominant-baseline="central">Ver</text>
  <rect class="tab" x="678" y="156" width="30" height="22" rx="4"/>
  <text class="lab tiny" x="693" y="167" text-anchor="middle" dominant-baseline="central">Run</text>
  <rect x="468" y="192" width="234" height="88" rx="5" fill="#fff" stroke="#3a4550"/>
  <text class="lab small" x="585" y="222" text-anchor="middle" dominant-baseline="central">Prepare step body</text>
  <text class="lab tiny" x="585" y="246" text-anchor="middle" dominant-baseline="central">one screen · no scroll</text>
  <text class="lab tiny" x="468" y="304">Advanced… / Debug = Menu only</text>
  <text class="lab tiny" x="468" y="326">Not phases · may scroll</text>

  <circle class="callout" cx="56" cy="116" r="13"/>
  <text class="callout-t" x="56" y="116" text-anchor="middle" dominant-baseline="central">1</text>
  <circle class="callout" cx="56" cy="200" r="13"/>
  <text class="callout-t" x="56" y="200" text-anchor="middle" dominant-baseline="central">2</text>
  <circle class="callout" cx="452" cy="116" r="13"/>
  <text class="callout-t" x="452" y="116" text-anchor="middle" dominant-baseline="central">3</text>
</svg>
