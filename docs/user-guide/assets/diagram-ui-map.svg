<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
  <title id="t">SharpCNC UI map</title>
  <desc id="d">Layout of header, essentials strip, visualizer, and workspace tabs</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .panel { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .header { fill: #1a2332; }
      .ess { fill: #e8eef4; stroke: #2c3e50; stroke-width: 1.5; }
      .viz { fill: #dfe8f0; stroke: #2c3e50; stroke-width: 1.5; }
      .rail { fill: #fff8f0; stroke: #2c3e50; stroke-width: 1.5; }
      .tab { fill: #ffffff; stroke: #2c3e50; stroke-width: 1.2; }
      .tab-on { fill: #2c3e50; }
      .lab { font-family: system-ui,Segoe UI,sans-serif; fill: #1a2332; }
      .lab-w { fill: #f4f6f8; }
      .small { font-size: 13px; }
      .tiny { font-size: 11px; fill: #4a5568; }
      .title { font-size: 16px; font-weight: 700; }
      .brand { font-size: 18px; font-weight: 700; fill: #f4f6f8; }
      .callout { fill: #c45c26; }
      .callout-t { fill: #ffffff; font-size: 11px; font-weight: 600; font-family: system-ui,Segoe UI,sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="720" height="420" rx="8"/>

  <!-- Window -->
  <rect class="panel" x="40" y="36" width="640" height="350" rx="10"/>

  <!-- Header -->
  <rect class="header" x="40" y="36" width="640" height="48" rx="10"/>
  <rect class="header" x="40" y="60" width="640" height="24"/>
  <text class="brand" x="58" y="68">SharpCNC</text>
  <text class="lab-w tiny" x="160" y="68">One machine · Clear position · Run the job</text>
  <rect x="580" y="50" width="78" height="28" rx="6" fill="#3d4f63" stroke="#f4f6f8" stroke-width="1"/>
  <text class="lab-w small" x="598" y="69">Menu</text>

  <!-- Essentials -->
  <rect class="ess" x="52" y="96" width="616" height="70" rx="8"/>
  <text class="lab title" x="64" y="118">Essentials strip</text>
  <rect x="64" y="128" width="170" height="28" rx="5" fill="#fff" stroke="#2c3e50"/>
  <text class="lab small" x="78" y="147">Connect · Port · Baud</text>
  <rect x="248" y="128" width="170" height="28" rx="5" fill="#fff" stroke="#2c3e50"/>
  <text class="lab small" x="268" y="147">Work / Machine XYZ</text>
  <rect x="432" y="128" width="220" height="28" rx="5" fill="#fff" stroke="#2c3e50"/>
  <text class="lab small" x="448" y="147">E-Stop · Hold · Unlock</text>

  <!-- Stage -->
  <rect class="viz" x="52" y="180" width="360" height="190" rx="8"/>
  <text class="lab title" x="68" y="206">Visualizer</text>
  <text class="lab tiny" x="68" y="226">Bed · stock · toolpath · toolhead</text>
  <rect x="90" y="244" width="280" height="100" rx="4" fill="#c5d4e0" stroke="#2c3e50" stroke-width="1"/>
  <text class="lab tiny" x="170" y="298">Machine bed view</text>
  <circle cx="220" cy="290" r="8" fill="#c45c26"/>

  <rect class="rail" x="428" y="180" width="240" height="190" rx="8"/>
  <text class="lab title" x="444" y="206">Workspace</text>
  <rect class="tab-on" x="444" y="220" width="60" height="26" rx="4"/>
  <text class="lab-w small" x="454" y="238">Move</text>
  <rect class="tab" x="512" y="220" width="60" height="26" rx="4"/>
  <text class="lab small" x="526" y="238">Job</text>
  <rect class="tab" x="580" y="220" width="60" height="26" rx="4"/>
  <text class="lab small" x="594" y="238">Log</text>
  <text class="lab tiny" x="444" y="272">Move: jog + work zeros</text>
  <text class="lab tiny" x="444" y="292">Job: material, SVG, run</text>
  <text class="lab tiny" x="444" y="312">Log: activity + debug</text>

  <!-- Callouts -->
  <circle class="callout" cx="52" cy="96" r="12"/>
  <text class="callout-t" x="48" y="100">1</text>
  <circle class="callout" cx="52" cy="180" r="12"/>
  <text class="callout-t" x="48" y="184">2</text>
  <circle class="callout" cx="428" cy="180" r="12"/>
  <text class="callout-t" x="424" y="184">3</text>
</svg>
