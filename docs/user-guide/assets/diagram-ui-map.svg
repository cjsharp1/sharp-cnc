<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d">
  <title id="t">SharpCNC UI map</title>
  <desc id="d">Layout of header, essentials strip, visualizer, and workspace tabs</desc>
  <defs>
    <style>
      .bg { fill: #f1f3f5; }
      .panel { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .header { fill: #1a2332; }
      .ess { fill: #e8eef3; stroke: #3a4550; stroke-width: 1.5; }
      .viz { fill: #d8e0e8; stroke: #3a4550; stroke-width: 1.5; }
      .rail { fill: #f7efd9; stroke: #3a4550; stroke-width: 1.5; }
      .tab { fill: #ffffff; stroke: #3a4550; stroke-width: 1.25; }
      .tab-on { fill: #3a4550; }
      .lab { font-family: system-ui, "Segoe UI", sans-serif; fill: #1a2332; }
      .lab-w { fill: #f1f3f5; font-family: system-ui, "Segoe UI", sans-serif; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; fill: #5a6570; }
      .title { font-size: 15px; font-weight: 700; }
      .brand { font-size: 18px; font-weight: 700; fill: #f1f3f5; }
      .callout { fill: #b8862d; }
      .callout-t { fill: #ffffff; font-size: 12px; font-weight: 700; font-family: system-ui, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="780" height="460" rx="10"/>
  <text class="lab title" x="28" y="30" style="font-size:18px">SharpCNC UI map</text>

  <rect class="panel" x="40" y="48" width="700" height="380" rx="12"/>

  <rect class="header" x="40" y="48" width="700" height="52" rx="12"/>
  <rect class="header" x="40" y="72" width="700" height="28"/>
  <text class="brand" x="60" y="82">SharpCNC</text>
  <text class="lab-w tiny" x="170" y="82">One machine · Clear position · Run the job</text>
  <rect x="630" y="62" width="88" height="28" rx="6" fill="#3d4f63" stroke="#f1f3f5" stroke-width="1"/>
  <text class="lab-w small" x="652" y="81">Menu</text>

  <rect class="ess" x="56" y="116" width="668" height="78" rx="8"/>
  <text class="lab title" x="72" y="142">Essentials strip</text>
  <rect x="72" y="154" width="180" height="28" rx="5" fill="#fff" stroke="#3a4550"/>
  <text class="lab small" x="86" y="173">Connect · Port · Baud</text>
  <rect x="268" y="154" width="180" height="28" rx="5" fill="#fff" stroke="#3a4550"/>
  <text class="lab small" x="288" y="173">Work / Machine XYZ</text>
  <rect x="464" y="154" width="240" height="28" rx="5" fill="#fff" stroke="#3a4550"/>
  <text class="lab small" x="482" y="173">E-Stop · Hold · Unlock</text>

  <rect class="viz" x="56" y="212" width="380" height="196" rx="8"/>
  <text class="lab title" x="72" y="240">Visualizer</text>
  <text class="lab tiny" x="72" y="260">Bed · stock · toolpath · toolhead</text>
  <rect x="96" y="276" width="300" height="108" rx="4" fill="#c5d4e0" stroke="#3a4550" stroke-width="1"/>
  <text class="lab tiny" x="186" y="302">Machine bed view</text>
  <circle cx="246" cy="348" r="8" fill="#b8862d"/>


  <rect class="rail" x="452" y="212" width="272" height="196" rx="8"/>
  <text class="lab title" x="468" y="240">Workspace</text>
  <rect class="tab-on" x="468" y="256" width="68" height="28" rx="5"/>
  <text class="lab-w small" x="482" y="275">Move</text>
  <rect class="tab" x="544" y="256" width="68" height="28" rx="5"/>
  <text class="lab small" x="564" y="275">Job</text>
  <rect class="tab" x="620" y="256" width="68" height="28" rx="5"/>
  <text class="lab small" x="640" y="275">Log</text>
  <text class="lab tiny" x="468" y="316">Move: jog + work zeros</text>
  <text class="lab tiny" x="468" y="338">Job: material, SVG, run</text>
  <text class="lab tiny" x="468" y="360">Log: activity + debug</text>

  <circle class="callout" cx="56" cy="116" r="13"/>
  <text class="callout-t" x="52" y="121">1</text>
  <circle class="callout" cx="56" cy="212" r="13"/>
  <text class="callout-t" x="52" y="217">2</text>
  <circle class="callout" cx="452" cy="212" r="13"/>
  <text class="callout-t" x="448" y="217">3</text>
</svg>
