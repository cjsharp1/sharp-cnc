<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
  <title id="t">Material presets to spindle and feed</title>
  <desc id="d">Flow from material and bit choices to suggested feed and spindle, then SVG G-code and runtime overrides</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .accent { fill: #f7efd9; stroke: #b8862d; stroke-width: 2; }
      .run { fill: #e8eef3; stroke: #3a4550; stroke-width: 2; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; }
      .title { font-size: 18px; font-weight: 700; }
      .tiny { font-size: 12px; fill: #5a6570; }
      .arrow { stroke: #3a4550; stroke-width: 2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="760" height="340" rx="10"/>
  <text class="lab title" x="28" y="36">Presets → F / S → cut</text>
  <text class="tiny" x="28" y="56">Material choices become feed and spindle suggestions</text>

  <rect class="box" x="28" y="80" width="180" height="110" rx="10"/>
  <text class="lab" x="44" y="112" font-weight="700">1. Material</text>
  <text class="tiny" x="44" y="138">Softwood · Hardwood</text>
  <text class="tiny" x="44" y="158">Acrylic · MDF</text>
  <text class="tiny" x="44" y="178">+ cut style + bit Ø</text>

  <path class="arrow" d="M218 135 H252"/>

  <rect class="accent" x="260" y="80" width="200" height="110" rx="10"/>
  <text class="lab" x="276" y="112" font-weight="700">2. Suggested F / S</text>
  <text class="tiny" x="276" y="138">Feed · Plunge · RPM</text>
  <text class="tiny" x="276" y="158">Persisted · Apply to SVG</text>
  <text class="tiny" x="276" y="178">Starting point only</text>

  <path class="arrow" d="M470 135 H504"/>

  <rect class="box" x="512" y="80" width="220" height="110" rx="10"/>
  <text class="lab" x="528" y="112" font-weight="700">3. SVG → G-code</text>
  <text class="tiny" x="528" y="138">M3 S… before cuts</text>
  <text class="tiny" x="528" y="158">F words on G1 moves</text>
  <text class="tiny" x="528" y="178">M5 then M2 at end</text>

  <path class="arrow" d="M360 200 V228"/>

  <rect class="run" x="180" y="236" width="400" height="76" rx="10"/>
  <text class="lab" x="200" y="266" font-weight="700">Runtime (Move tab)</text>
  <text class="tiny" x="200" y="288">Feed override 0x90–0x94 · Spindle override 0x99–0x9D</text>
  <text class="tiny" x="200" y="306">Manual M3 / M5 · soft limits unchanged</text>
</svg>
