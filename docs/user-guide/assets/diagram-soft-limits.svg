<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-labelledby="t d">
  <title id="t">Home switches vs soft limits</title>
  <desc id="d">Zero-side physical switches, XY soft envelope, and Z travel from 0 at home down to −$132</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .bed { fill: #d8e0e8; stroke: #3a4550; stroke-width: 2.5; }
      .soft { fill: rgba(184, 92, 42, 0.07); stroke: #b85c2a; stroke-width: 2.5; stroke-dasharray: 9 6; }
      .sw { fill: #1f6a4a; }
      .panel { fill: #fff4eb; stroke: #b85c2a; stroke-width: 2; }
      .callout { fill: #ffffff; stroke: #b85c2a; stroke-width: 2; }
      .zbar { fill: #cfd6dd; stroke: #3a4550; stroke-width: 2; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; }
      .title { font-size: 18px; font-weight: 700; }
      .strong { font-weight: 700; }
      .tiny { font-size: 12px; fill: #5a6570; }
      .ok { fill: #1f6a4a; }
      .warn { fill: #b85c2a; }
      .brass { fill: #b8862d; }
      .dot { fill: #3a4550; }
      .leader { stroke: #b85c2a; stroke-width: 1.75; fill: none; }
      .leader-ok { stroke: #1f6a4a; stroke-width: 1.5; fill: none; }
      .zline { stroke: #1f6a4a; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="920" height="640" rx="10"/>
  <text class="lab title" x="32" y="40">Home switches vs soft limits</text>
  <text class="tiny" x="32" y="62">XY: switches on the zero corner · Z: 0 at home (top) down to −$132</text>

  <!-- Square bed -->
  <rect class="bed" x="80" y="100" width="260" height="260" rx="8"/>
  <text class="tiny" x="96" y="124">Machine bed (XY)</text>

  <rect class="soft" x="104" y="136" width="212" height="208" rx="4"/>
  <text class="tiny warn" x="210" y="164" text-anchor="middle">Soft-limit envelope</text>
  <text class="tiny" x="210" y="250" text-anchor="middle">Far side</text>
  <text class="tiny" x="210" y="268" text-anchor="middle">(no switches)</text>

  <circle class="dot" cx="124" cy="324" r="7"/>
  <text class="lab strong" x="138" y="312">0,0</text>

  <path class="leader" d="M316 156 H360"/>
  <circle class="warn" cx="316" cy="156" r="4.5"/>
  <rect class="callout" x="360" y="100" width="200" height="110" rx="10"/>
  <text class="lab strong warn" x="380" y="132">Max XY travel</text>
  <text class="tiny" x="380" y="156">$130 / $131</text>
  <text class="tiny" x="380" y="178">Software stop · $20 = 1</text>
  <text class="tiny" x="380" y="198">Default bed 1000 × 1000</text>

  <rect class="sw" x="52" y="314" width="18" height="46" rx="3"/>
  <rect class="sw" x="80" y="370" width="46" height="18" rx="3"/>
  <path class="leader-ok" d="M124 324 V392"/>
  <text class="lab strong ok" x="80" y="430">Home / limit switches</text>
  <text class="tiny" x="80" y="450">Physical switches only on the zero side</text>

  <!-- Z column: 0 at top → −$132 -->
  <text class="lab strong" x="600" y="100">Z travel</text>
  <text class="tiny" x="600" y="120">Machine Z (home = top)</text>
  <rect class="zbar" x="640" y="140" width="36" height="280" rx="4"/>
  <line class="zline" x1="630" y1="140" x2="686" y2="140"/>
  <line class="zline" x1="630" y1="420" x2="686" y2="420"/>
  <text class="lab strong ok" x="700" y="148">0 · Z home</text>
  <text class="tiny" x="700" y="168">Top of travel</text>
  <text class="tiny brass" x="700" y="280">Negative below home</text>
  <text class="lab strong warn" x="700" y="424">−$132</text>
  <text class="tiny" x="700" y="444">Bottom of soft travel</text>
  <path class="leader" d="M658 150 V400" stroke-dasharray="4 4"/>
  <polygon fill="#b8862d" points="658,400 652,386 664,386"/>

  <rect class="panel" x="580" y="480" width="300" height="120" rx="12"/>
  <text class="lab strong" x="600" y="512">Remember</text>
  <text class="tiny" x="600" y="538">XY: zero side = hard switches</text>
  <text class="tiny" x="600" y="558">XY far / Z bottom = soft limits</text>
  <text class="tiny" x="600" y="578">Set $132 as a positive length</text>

  <text class="tiny" x="32" y="610">Soft limits only help when travel values are correct and $20 is on.</text>
</svg>
