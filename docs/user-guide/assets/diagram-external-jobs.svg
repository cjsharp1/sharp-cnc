<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d">
  <title id="t">External jobs sources</title>
  <desc id="d">Watched local folder and optional Google Drive path into SharpCNC</desc>
  <defs>
    <style>
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .ok { fill: #e8f4ee; stroke: #1f6a4a; stroke-width: 2; }
      .soon { fill: #fff8f0; stroke: #b85c2a; stroke-width: 2; stroke-dasharray: 6 4; }
      .lab { font-family: system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; font-weight: 700; }
      .title { font-size: 18px; font-weight: 700; }
      .tiny { font-size: 12px; fill: #5a6570; font-weight: 400; }
      .line { stroke: #3a4550; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="760" height="320" rx="10"/>
  <text class="lab title" x="28" y="36">External jobs</text>
  <text class="tiny" x="28" y="56">Watched folder today · Drive when configured</text>

  <rect class="ok" x="36" y="84" width="220" height="140" rx="12"/>
  <text class="lab" x="146" y="124" text-anchor="middle">Watched folder</text>
  <text class="tiny" x="146" y="150" text-anchor="middle">Pick… a local path</text>
  <text class="tiny" x="146" y="170" text-anchor="middle">.nc · .gcode · .svg</text>
  <text class="tiny" x="146" y="190" text-anchor="middle">Auto-refresh ~2.5s</text>
  <text class="lab" x="146" y="214" text-anchor="middle" fill="#1f6a4a">Works today</text>

  <rect class="soon" x="280" y="84" width="220" height="140" rx="12"/>
  <text class="lab" x="390" y="124" text-anchor="middle">Google Drive</text>
  <text class="tiny" x="390" y="150" text-anchor="middle">OAuth when client ID</text>
  <text class="tiny" x="390" y="170" text-anchor="middle">is configured</text>
  <text class="tiny" x="390" y="190" text-anchor="middle">or use Drive Desktop</text>
  <text class="tiny" x="390" y="210" text-anchor="middle">folder as watched path</text>

  <path class="line" d="M510 154 H550"/>

  <rect class="box" x="558" y="104" width="168" height="100" rx="12"/>
  <text class="lab" x="642" y="148" text-anchor="middle">SharpCNC</text>
  <text class="tiny" x="642" y="172" text-anchor="middle">Job / SVG loaders</text>

  <text class="tiny" x="36" y="266">Menu → External jobs… or open the Job tab strip.</text>
  <text class="tiny" x="36" y="288">Click a listed file to open it. Folder pick needs the desktop app.</text>
</svg>
