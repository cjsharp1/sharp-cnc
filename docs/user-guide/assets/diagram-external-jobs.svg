<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
  <title id="t">External jobs sources</title>
  <desc id="d">Watched local folder and optional Google Drive path into SharpCNC</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .ok { fill: #e8f4ee; stroke: #1f6a4a; stroke-width: 2; }
      .soon { fill: #fff8f0; stroke: #b85c2a; stroke-width: 2; stroke-dasharray: 6 4; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; font-weight: 700; }
      .title { font-size: 18px; font-weight: 700; }
      .tiny { font-size: 12px; fill: #5a6570; font-weight: 400; }
      .line { stroke: #3a4550; stroke-width: 2; fill: none; }
      .arrow { stroke: #3a4550; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="760" height="340" rx="10"/>
  <text class="lab title" x="28" y="36">External jobs</text>
  <text class="tiny" x="28" y="56">Watched folder today · Drive when configured</text>

  <rect class="ok" x="36" y="78" width="240" height="120" rx="12"/>
  <text class="lab" x="156" y="112" text-anchor="middle">Watched folder</text>
  <text class="tiny" x="156" y="136" text-anchor="middle">Pick… a local path</text>
  <text class="tiny" x="156" y="156" text-anchor="middle">.nc · .gcode · .svg · ~2.5s refresh</text>
  <text class="lab" x="156" y="182" text-anchor="middle" fill="#1f6a4a">Works today</text>

  <rect class="soon" x="36" y="214" width="240" height="80" rx="12"/>
  <text class="lab" x="156" y="246" text-anchor="middle">Google Drive</text>
  <text class="tiny" x="156" y="270" text-anchor="middle">OAuth or Drive Desktop folder</text>

  <!-- Fan-in to SharpCNC -->
  <path class="line" d="M276 138 H320"/>
  <path class="line" d="M276 254 H320"/>
  <path class="line" d="M320 138 V254"/>
  <path class="arrow" d="M320 196 H500"/>

  <rect class="box" x="510" y="146" width="210" height="100" rx="12"/>
  <text class="lab" x="615" y="190" text-anchor="middle">SharpCNC</text>
  <text class="tiny" x="615" y="216" text-anchor="middle">Job / SVG loaders</text>

  <text class="tiny" x="36" y="318">Menu → External jobs… · click a listed file · folder pick needs desktop app</text>
</svg>
