<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
  <title id="t">G38.2 probe cycle</title>
  <desc id="d">Seek down, contact, report PRB, set work Z with plate thickness</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .accent { fill: #b8862d; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; }
      .arrow { stroke: #3a4550; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .tiny { font-size: 12px; fill: #5a6570; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1a2332; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="360" rx="10"/>
  <text class="lab title" x="28" y="36">Probe cycle (G38.2)</text>
  <text class="tiny" x="28" y="56">Seek · contact · report · set work Z</text>

  <rect class="box" x="28" y="80" width="160" height="190" rx="12"/>
  <circle class="accent" cx="52" cy="108" r="15"/>
  <text class="w" x="52" y="108" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="lab" x="76" y="114" font-weight="700">Prepare</text>
  <text class="tiny" x="44" y="148">Idle · unlocked</text>
  <text class="tiny" x="44" y="168">Clip + plate on</text>
  <text class="tiny" x="44" y="188">XY over plate</text>
  <text class="tiny" x="44" y="208">Z clear above</text>
  <text class="mono" x="44" y="240">G91</text>

  <path class="arrow" d="M198 175 H230"/>

  <rect class="box" x="238" y="80" width="160" height="190" rx="12"/>
  <circle class="accent" cx="262" cy="108" r="15"/>
  <text class="w" x="262" y="108" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="lab" x="286" y="114" font-weight="700">Seek</text>
  <text class="tiny" x="254" y="148">Probe toward −Z</text>
  <text class="mono" x="254" y="178">G38.2 Z-30 F80</text>
  <text class="tiny" x="254" y="210">Slow feed</text>
  <text class="tiny" x="254" y="230">Stops on contact</text>

  <path class="arrow" d="M408 175 H440"/>

  <rect class="box" x="448" y="80" width="170" height="190" rx="12"/>
  <circle class="accent" cx="472" cy="108" r="15"/>
  <text class="w" x="472" y="108" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="lab" x="496" y="114" font-weight="700">Report</text>
  <text class="mono" x="464" y="156">[PRB:x,y,z:1]</text>
  <text class="tiny" x="464" y="184">then ok</text>
  <text class="tiny" x="464" y="214">ALARM:4 no hit</text>
  <text class="tiny" x="464" y="234">ALARM:5 early</text>

  <path class="arrow" d="M628 175 H660"/>

  <rect class="box" x="668" y="80" width="104" height="190" rx="12"/>
  <circle class="ok" cx="720" cy="128" r="18"/>
  <text class="w" x="720" y="128" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="lab" x="720" y="172" text-anchor="middle" font-weight="700">Zero</text>
  <text class="tiny" x="720" y="198" text-anchor="middle">G10 L20</text>
  <text class="tiny" x="720" y="218" text-anchor="middle">P1 Zt</text>
  <text class="tiny" x="720" y="238" text-anchor="middle">+ G90</text>

  <text class="tiny" x="28" y="308">SharpCNC refuses probe in Alarm / Hold / Run / while a job streams, and if the probe pin is already ON.</text>
  <text class="tiny" x="28" y="330">E-Stop (UI or hardware) still aborts. Remove the plate before Start.</text>
</svg>
