<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">G38.2 probe cycle</title>
  <desc id="d">Seek down, contact, report PRB, set work Z with plate thickness</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .accent { fill: #c45c26; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: system-ui,Segoe UI,sans-serif; fill: #1a2332; font-size: 13px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: system-ui,Segoe UI,sans-serif; font-size: 13px; font-weight: 700; }
      .arrow { stroke: #2c3e50; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .tiny { font-size: 11px; fill: #4a5568; }
      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1a2332; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="300" rx="8"/>
  <text class="lab title" x="24" y="36">Probe cycle (G38.2)</text>

  <rect class="box" x="24" y="60" width="150" height="170" rx="10"/>
  <circle class="accent" cx="48" cy="86" r="14"/>
  <text class="w" x="43" y="91">1</text>
  <text class="lab" x="70" y="92" font-weight="700">Prepare</text>
  <text class="tiny" x="40" y="120">Idle · unlocked</text>
  <text class="tiny" x="40" y="138">Clip + plate on</text>
  <text class="tiny" x="40" y="156">XY over plate</text>
  <text class="tiny" x="40" y="174">Z clear above</text>
  <text class="mono" x="40" y="206">G91</text>

  <path class="arrow" d="M184 145 H214"/>

  <rect class="box" x="220" y="60" width="150" height="170" rx="10"/>
  <circle class="accent" cx="244" cy="86" r="14"/>
  <text class="w" x="239" y="91">2</text>
  <text class="lab" x="266" y="92" font-weight="700">Seek</text>
  <text class="tiny" x="236" y="120">Probe toward −Z</text>
  <text class="mono" x="236" y="148">G38.2 Z-30 F80</text>
  <text class="tiny" x="236" y="176">Slow feed</text>
  <text class="tiny" x="236" y="194">Stops on contact</text>

  <path class="arrow" d="M380 145 H410"/>

  <rect class="box" x="416" y="60" width="150" height="170" rx="10"/>
  <circle class="accent" cx="440" cy="86" r="14"/>
  <text class="w" x="435" y="91">3</text>
  <text class="lab" x="462" y="92" font-weight="700">Report</text>
  <text class="mono" x="432" y="130">[PRB:x,y,z:1]</text>
  <text class="tiny" x="432" y="156">then ok</text>
  <text class="tiny" x="432" y="184">ALARM:4 no hit</text>
  <text class="tiny" x="432" y="202">ALARM:5 early</text>

  <path class="arrow" d="M576 145 H606"/>

  <rect class="box" x="612" y="60" width="90" height="170" rx="10"/>
  <circle class="ok" cx="657" cy="110" r="18"/>
  <text class="w" x="651" y="115">4</text>
  <text class="lab" x="628" y="152" font-weight="700">Zero</text>
  <text class="tiny" x="622" y="176">G10 L20</text>
  <text class="tiny" x="622" y="194">P1 Zt</text>
  <text class="tiny" x="622" y="212">+ G90</text>

  <text class="tiny" x="24" y="260">SharpCNC refuses probe in Alarm / Hold / Run / while a job streams, and if the probe pin is already ON.</text>
  <text class="tiny" x="24" y="280">E-Stop (UI or hardware) still aborts. Remove the plate before Start.</text>
</svg>
