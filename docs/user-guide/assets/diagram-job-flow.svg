<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" role="img" aria-labelledby="t d">
  <title id="t">Job load and run flow</title>
  <desc id="d">Load or generate, simulate, then start pause stop on the machine</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .sim { fill: #e8f4ee; stroke: #1f6a4a; stroke-width: 2; }
      .run { fill: #fff3e8; stroke: #c45c26; stroke-width: 2; }
      .lab { font-family: system-ui,Segoe UI,sans-serif; fill: #1a2332; font-size: 13px; font-weight: 700; }
      .title { font-size: 18px; font-weight: 700; }
      .tiny { font-size: 11px; fill: #4a5568; font-weight: 400; }
      .line { stroke: #2c3e50; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect class="bg" width="700" height="280" rx="8"/>
  <text class="lab title" x="24" y="36">From file to cutting</text>

  <rect class="box" x="16" y="70" width="110" height="100" rx="10"/>
  <text class="lab" x="36" y="112">Load</text>
  <text class="tiny" x="28" y="136">.nc / SVG</text>
  <text class="tiny" x="28" y="154">→ job</text>

  <path class="line" d="M132 120 H148"/>

  <rect class="box" x="152" y="70" width="110" height="100" rx="10"/>
  <text class="lab" x="168" y="108">Prepare</text>
  <text class="tiny" x="164" y="132">XY + Z probe</text>
  <text class="tiny" x="164" y="150">Mark ready</text>

  <path class="line" d="M268 120 H284"/>

  <rect class="sim" x="288" y="70" width="120" height="100" rx="10"/>
  <text class="lab" x="312" y="112">Simulate</text>
  <text class="tiny" x="300" y="136">Preview only</text>
  <text class="tiny" x="300" y="154">No serial</text>

  <path class="line" d="M414 120 H430"/>

  <rect class="run" x="434" y="70" width="120" height="100" rx="10"/>
  <text class="lab" x="468" y="112">Start</text>
  <text class="tiny" x="448" y="136">Stream GRBL</text>
  <text class="tiny" x="448" y="154">Pause / Stop</text>

  <path class="line" d="M586 120 H622"/>

  <rect class="box" x="630" y="85" width="50" height="70" rx="10"/>
  <text class="lab" x="640" y="128">Done</text>

  <text class="tiny" x="24" y="210">Always Simulate first when you are unsure about the path, stock placement, or soft limits.</text>
  <text class="tiny" x="24" y="230">Start is blocked while Alarm-locked, while a job is already running, or if the path exceeds soft travel.</text>
  <text class="tiny" x="24" y="250">E-Stop = feed hold + soft reset. Demon Shield hardware buttons should stay reachable too.</text>
  <text class="tiny" x="24" y="270">Keep hands clear of the spindle and moving axes while Running.</text>
</svg>
