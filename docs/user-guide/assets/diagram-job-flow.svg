<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="t d">
  <title id="t">Job load and run flow</title>
  <desc id="d">Load or generate, simulate, then start pause stop on the machine</desc>
  <defs>
    <style>
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .sim { fill: #e8f4ee; stroke: #1f6a4a; stroke-width: 2; }
      .run { fill: #fff4eb; stroke: #b85c2a; stroke-width: 2; }
      .lab { font-family: system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; font-weight: 700; }
      .title { font-size: 18px; font-weight: 700; }
      .tiny { font-size: 12px; fill: #5a6570; font-weight: 400; }
      .line { stroke: #3a4550; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="820" height="340" rx="10"/>
  <text class="lab title" x="28" y="36">From file to cutting</text>
  <text class="tiny" x="28" y="56">Load → prepare → simulate → start</text>

  <rect class="box" x="28" y="84" width="120" height="110" rx="12"/>
  <text class="lab" x="88" y="128" text-anchor="middle">Load</text>
  <text class="tiny" x="88" y="152" text-anchor="middle">.nc / SVG</text>
  <text class="tiny" x="88" y="170" text-anchor="middle">→ job</text>

  <path class="line" d="M158 140 H180"/>

  <rect class="box" x="188" y="84" width="120" height="110" rx="12"/>
  <text class="lab" x="248" y="128" text-anchor="middle">Prepare</text>
  <text class="tiny" x="248" y="152" text-anchor="middle">XY + Z probe</text>
  <text class="tiny" x="248" y="170" text-anchor="middle">Mark ready</text>

  <path class="line" d="M318 140 H340"/>

  <rect class="sim" x="348" y="84" width="130" height="110" rx="12"/>
  <text class="lab" x="413" y="128" text-anchor="middle">Simulate</text>
  <text class="tiny" x="413" y="152" text-anchor="middle">Preview only</text>
  <text class="tiny" x="413" y="170" text-anchor="middle">No serial</text>

  <path class="line" d="M488 140 H510"/>

  <rect class="run" x="518" y="84" width="130" height="110" rx="12"/>
  <text class="lab" x="583" y="128" text-anchor="middle">Start</text>
  <text class="tiny" x="583" y="152" text-anchor="middle">Stream GRBL</text>
  <text class="tiny" x="583" y="170" text-anchor="middle">Pause / Stop</text>

  <path class="line" d="M658 140 H690"/>

  <rect class="box" x="698" y="100" width="90" height="78" rx="12"/>
  <text class="lab" x="743" y="146" text-anchor="middle">Done</text>

  <text class="tiny" x="28" y="240">Always Simulate first when you are unsure about the path, stock placement, or soft limits.</text>
  <text class="tiny" x="28" y="262">Start is blocked while Alarm-locked, while a job is already running, or if the path exceeds soft travel.</text>
  <text class="tiny" x="28" y="284">E-Stop = feed hold + soft reset. Demon Shield hardware buttons should stay reachable too.</text>
  <text class="tiny" x="28" y="306">Keep hands clear of the spindle and moving axes while Running.</text>
</svg>
