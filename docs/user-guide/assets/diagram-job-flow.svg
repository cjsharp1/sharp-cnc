<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="t d">
  <title id="t">Prepare Verify Run job flow</title>
  <desc id="d">Load in Prepare, simulate and Start in Verify, supervise in Run</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .sim { fill: #e8f4ee; stroke: #1f6a4a; stroke-width: 2; }
      .run { fill: #fff4eb; stroke: #b85c2a; stroke-width: 2; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; font-weight: 700; }
      .title { font-size: 18px; font-weight: 700; }
      .tiny { font-size: 12px; fill: #5a6570; font-weight: 400; }
      .line { stroke: #3a4550; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="820" height="340" rx="10"/>
  <text class="lab title" x="28" y="36">From file to cutting</text>
  <text class="tiny" x="28" y="56">Prepare → Verify → Run</text>

  <rect class="box" x="28" y="84" width="130" height="110" rx="12"/>
  <text class="lab" x="93" y="122" text-anchor="middle">Prepare</text>
  <text class="tiny" x="93" y="146" text-anchor="middle">Load · place</text>
  <text class="tiny" x="93" y="164" text-anchor="middle">Mark ready</text>

  <path class="line" d="M168 140 H190"/>

  <rect class="sim" x="198" y="84" width="150" height="110" rx="12"/>
  <text class="lab" x="273" y="122" text-anchor="middle">Verify</text>
  <text class="tiny" x="273" y="146" text-anchor="middle">Simulate · checklist</text>
  <text class="tiny" x="273" y="164" text-anchor="middle">Start</text>

  <path class="line" d="M358 140 H380"/>

  <rect class="run" x="388" y="84" width="150" height="110" rx="12"/>
  <text class="lab" x="463" y="122" text-anchor="middle">Run</text>
  <text class="tiny" x="463" y="146" text-anchor="middle">Overrides · progress</text>
  <text class="tiny" x="463" y="164" text-anchor="middle">Hold / Stop</text>

  <path class="line" d="M548 140 H580"/>

  <rect class="box" x="588" y="100" width="100" height="78" rx="12"/>
  <text class="lab" x="638" y="146" text-anchor="middle">Done</text>

  <text class="tiny" x="28" y="240">Always Simulate in Verify when unsure about path, stock placement, or soft limits.</text>
  <text class="tiny" x="28" y="262">Start is blocked while Alarm-locked, while streaming, or if the path exceeds soft travel.</text>
  <text class="tiny" x="28" y="284">Practice once on Virtual CNC before the first real cut. E-Stop + Demon Shield buttons stay reachable.</text>
  <text class="tiny" x="28" y="306">Keep hands clear of the spindle and moving axes while Running.</text>
</svg>
