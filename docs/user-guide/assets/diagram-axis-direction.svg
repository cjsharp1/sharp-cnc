<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Axis direction invert ($3)</title>
  <desc id="d">GRBL $3 bitmask bits for X Y Z and test jog to confirm direction</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .accent { fill: #c45c26; }
      .ok { fill: #1f6a4a; }
      .bit { fill: #eef3f7; stroke: #2c3e50; stroke-width: 1.5; }
      .lab { font-family: system-ui,Segoe UI,sans-serif; fill: #1a2332; font-size: 13px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: system-ui,Segoe UI,sans-serif; font-size: 13px; font-weight: 700; }
      .tiny { font-size: 11px; fill: #4a5568; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1a2332; font-size: 12px; }
      .arrow { stroke: #c45c26; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c45c26"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="300" rx="8"/>
  <text class="lab title" x="24" y="36">Axis direction invert — GRBL $3</text>

  <rect class="box" x="24" y="58" width="280" height="200" rx="10"/>
  <text class="lab" x="40" y="86" font-weight="700">Bitmask (0–7)</text>
  <text class="tiny" x="40" y="106">Each bit flips one stepper direction</text>

  <rect class="bit" x="40" y="124" width="72" height="56" rx="6"/>
  <text class="lab" x="62" y="148" font-weight="700">bit 0</text>
  <text class="mono" x="66" y="168">X = 1</text>

  <rect class="bit" x="128" y="124" width="72" height="56" rx="6"/>
  <text class="lab" x="150" y="148" font-weight="700">bit 1</text>
  <text class="mono" x="154" y="168">Y = 2</text>

  <rect class="bit" x="216" y="124" width="72" height="56" rx="6"/>
  <text class="lab" x="238" y="148" font-weight="700">bit 2</text>
  <text class="mono" x="242" y="168">Z = 4</text>

  <text class="mono" x="40" y="210">$3 = X + Y + Z</text>
  <text class="tiny" x="40" y="232">Example: invert X and Z → $3=5</text>

  <rect class="box" x="328" y="58" width="368" height="200" rx="10"/>
  <circle class="accent" cx="352" cy="84" r="14"/>
  <text class="w" x="347" y="89">1</text>
  <text class="lab" x="374" y="90" font-weight="700">Toggle · Write · Test</text>
  <text class="tiny" x="348" y="120">1. Read $$ — see current $3</text>
  <text class="tiny" x="348" y="140">2. Toggle Invert X / Y / Z independently</text>
  <text class="tiny" x="348" y="160">3. Write $3=… to GRBL EEPROM</text>
  <text class="tiny" x="348" y="180">4. Test +X / −X (5 mm) and check the bed</text>

  <line class="arrow" x1="360" y1="210" x2="520" y2="210"/>
  <text class="lab" x="530" y="214" font-weight="700">+X should go right</text>
  <text class="tiny" x="348" y="240">If it goes the wrong way, invert that axis and write again.</text>
</svg>
