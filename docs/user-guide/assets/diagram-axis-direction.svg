<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
  <title id="t">Axis direction invert ($3)</title>
  <desc id="d">GRBL $3 bitmask bits for X Y Z and test jog to confirm direction</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .accent { fill: #b8862d; }
      .bit { fill: #e8eef3; stroke: #3a4550; stroke-width: 1.5; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; }
      .tiny { font-size: 12px; fill: #5a6570; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a2332; font-size: 13px; }
      .arrow { stroke: #b8862d; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8862d"/>
    </marker>
  </defs>

  <rect class="bg" width="760" height="340" rx="10"/>
  <text class="lab title" x="28" y="36">Axis direction invert — GRBL $3</text>
  <text class="tiny" x="28" y="56">Each bit flips one stepper direction</text>

  <rect class="box" x="28" y="76" width="300" height="220" rx="12"/>
  <text class="lab" x="48" y="108" font-weight="700">Bitmask (0–7)</text>
  <text class="tiny" x="48" y="128">Sum the bits you want to invert</text>

  <rect class="bit" x="48" y="148" width="76" height="60" rx="8"/>
  <text class="lab" x="68" y="174" font-weight="700">bit 0</text>
  <text class="mono" x="68" y="196">X = 1</text>

  <rect class="bit" x="140" y="148" width="76" height="60" rx="8"/>
  <text class="lab" x="160" y="174" font-weight="700">bit 1</text>
  <text class="mono" x="160" y="196">Y = 2</text>

  <rect class="bit" x="232" y="148" width="76" height="60" rx="8"/>
  <text class="lab" x="252" y="174" font-weight="700">bit 2</text>
  <text class="mono" x="252" y="196">Z = 4</text>

  <text class="mono" x="48" y="240">$3 = X + Y + Z</text>
  <text class="tiny" x="48" y="266">Example: invert X and Z → $3 = 5</text>

  <rect class="box" x="356" y="76" width="376" height="220" rx="12"/>
  <circle class="accent" cx="384" cy="108" r="15"/>
  <text class="w" x="379" y="113">1</text>
  <text class="lab" x="410" y="114" font-weight="700">Toggle · Write · Test</text>
  <text class="tiny" x="372" y="148">1. Read $$ — see current $3</text>
  <text class="tiny" x="372" y="170">2. Toggle Invert X / Y / Z independently</text>
  <text class="tiny" x="372" y="192">3. Write $3=… to GRBL EEPROM</text>
  <text class="tiny" x="372" y="214">4. Test +X / −X (5 mm) and check the bed</text>

  <line class="arrow" x1="384" y1="246" x2="520" y2="246"/>
  <text class="lab" x="536" y="252" font-weight="700">+X → right</text>
  <text class="tiny" x="372" y="276">If it goes the wrong way, invert that axis and write again.</text>
</svg>
