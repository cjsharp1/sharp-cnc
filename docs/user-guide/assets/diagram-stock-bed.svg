<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="t d">
  <title id="t">Stock on bed</title>
  <desc id="d">Material placed on the machine bed with corner labels</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .bed { fill: #d8e0e8; stroke: #3a4550; stroke-width: 2.5; }
      .stock { fill: #e8c9a0; stroke: #8a5a2b; stroke-width: 2.5; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; }
      .title { font-size: 18px; font-weight: 700; }
      .corner { font-size: 13px; font-weight: 700; fill: #b85c2a; }
      .tiny { font-size: 12px; fill: #5a6570; }
      .dot { fill: #3a4550; }
    </style>
  </defs>

  <rect class="bg" width="760" height="480" rx="10"/>
  <text class="lab title" x="28" y="36">Stock on the bed</text>
  <text class="tiny" x="28" y="56">Pick a corner or type Offset X / Offset Y in Material &amp; tool</text>

  <!-- Square bed — corner labels outside strokes -->
  <rect class="bed" x="120" y="100" width="300" height="300" rx="8"/>
  <text class="tiny" x="270" y="88" text-anchor="middle">Bed (soft travel X × Y)</text>

  <circle class="dot" cx="140" cy="380" r="6"/>
  <text class="corner" x="100" y="412">SW</text>
  <text class="tiny" x="100" y="430">Front-left</text>

  <circle class="dot" cx="400" cy="380" r="6"/>
  <text class="corner" x="380" y="412">SE</text>
  <text class="tiny" x="356" y="430">Front-right</text>

  <circle class="dot" cx="140" cy="120" r="6"/>
  <text class="corner" x="48" y="116">NW</text>
  <text class="tiny" x="32" y="134">Back-left</text>

  <circle class="dot" cx="400" cy="120" r="6"/>
  <text class="corner" x="420" y="116">NE</text>
  <text class="tiny" x="420" y="134">Back-right</text>

  <rect class="stock" x="250" y="260" width="140" height="90" rx="4"/>
  <text class="lab" x="320" y="298" text-anchor="middle" dominant-baseline="central" font-weight="700">Stock</text>
  <text class="tiny" x="320" y="320" text-anchor="middle" dominant-baseline="central">Width × Length</text>

  <text class="tiny" x="500" y="160">Example: SE corner</text>
  <text class="tiny" x="500" y="180">placement — the orange</text>
  <text class="tiny" x="500" y="200">rectangle appears on the</text>
  <text class="tiny" x="500" y="220">visualizer relative to the bed.</text>
  <text class="tiny" x="500" y="260">Corners: SW · SE · NW · NE</text>
  <text class="tiny" x="500" y="280">or custom Offset X / Y.</text>

  <text class="tiny" x="28" y="456">Clamp stock firmly before jogging near edges or probing Z.</text>
</svg>
