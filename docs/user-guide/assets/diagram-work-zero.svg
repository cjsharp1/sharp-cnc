<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
  <title id="t">Work zero vs machine zero</title>
  <desc id="d">Machine coordinates from home and work coordinates from stock origin</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .bed { fill: #d7e0e8; stroke: #2c3e50; stroke-width: 2; }
      .stock { fill: #e8c9a0; stroke: #8a5a2b; stroke-width: 2; }
      .lab { font-family: system-ui,Segoe UI,sans-serif; fill: #1a2332; font-size: 13px; }
      .title { font-size: 18px; font-weight: 700; }
      .m { fill: #2c3e50; font-weight: 700; }
      .w { fill: #c45c26; font-weight: 700; }
      .tiny { font-size: 11px; fill: #4a5568; }
      .axis-m { stroke: #2c3e50; stroke-width: 2; marker-end: url(#am); }
      .axis-w { stroke: #c45c26; stroke-width: 2; marker-end: url(#aw); }
    </style>
    <marker id="am" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
    <marker id="aw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c45c26"/>
    </marker>
  </defs>
  <rect class="bg" width="600" height="300" rx="8"/>
  <text class="lab title" x="24" y="34">Machine position vs work zero</text>

  <rect class="bed" x="60" y="60" width="320" height="200" rx="6"/>
  <rect class="stock" x="180" y="130" width="140" height="90" rx="4"/>

  <circle cx="80" cy="240" r="7" fill="#2c3e50"/>
  <text class="lab m" x="92" y="230">Machine 0</text>
  <text class="tiny" x="92" y="246">(home)</text>
  <line class="axis-m" x1="80" y1="240" x2="200" y2="240"/>
  <line class="axis-m" x1="80" y1="240" x2="80" y2="100"/>

  <circle cx="190" cy="210" r="7" fill="#c45c26"/>
  <text class="lab w" x="204" y="200">Work 0</text>
  <text class="tiny" x="204" y="216">(stock corner)</text>
  <line class="axis-w" x1="190" y1="210" x2="300" y2="210"/>
  <line class="axis-w" x1="190" y1="210" x2="190" y2="140"/>

  <text class="tiny" x="410" y="100">Position panel shows both:</text>
  <text class="lab m" x="410" y="128">Machine = from home</text>
  <text class="lab w" x="410" y="152">Work = from job origin</text>
  <text class="tiny" x="410" y="184">Zero X/Y/Z/XYZ uses</text>
  <text class="tiny" x="410" y="202">G10 L20 — sets origin</text>
  <text class="tiny" x="410" y="220">at the current tool tip.</text>
  <text class="tiny" x="410" y="248">It does not move the</text>
  <text class="tiny" x="410" y="266">machine by itself.</text>
</svg>
