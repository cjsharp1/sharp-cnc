<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Calibration measure flow</title>
  <desc id="d">Command move, measure with ruler, compute and write steps per mm</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .accent { fill: #c45c26; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: system-ui,Segoe UI,sans-serif; fill: #1a2332; font-size: 13px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: system-ui,Segoe UI,sans-serif; font-size: 13px; font-weight: 700; }
      .arrow { stroke: #2c3e50; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .tiny { font-size: 11px; fill: #4a5568; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="320" rx="8"/>
  <text class="lab title" x="24" y="36">Steps/mm calibration flow</text>

  <!-- Step 1 -->
  <rect class="box" x="24" y="70" width="150" height="160" rx="10"/>
  <circle class="accent" cx="48" cy="96" r="14"/>
  <text class="w" x="43" y="101">1</text>
  <text class="lab" x="70" y="102" font-weight="700">Command</text>
  <text class="tiny" x="40" y="130">Pick axis + distance</text>
  <text class="tiny" x="40" y="148">(50 / 100 / 200 mm)</text>
  <text class="tiny" x="40" y="176">Press</text>
  <text class="lab" x="40" y="196" font-weight="700">Move +100 X</text>
  <text class="tiny" x="40" y="216">Machine jogs that far</text>

  <path class="arrow" d="M184 150 H214"/>

  <!-- Step 2 -->
  <rect class="box" x="220" y="70" width="150" height="160" rx="10"/>
  <circle class="accent" cx="244" cy="96" r="14"/>
  <text class="w" x="239" y="101">2</text>
  <text class="lab" x="266" y="102" font-weight="700">Measure</text>
  <text class="tiny" x="236" y="130">Use a ruler / dial</text>
  <text class="tiny" x="236" y="148">on the real motion</text>
  <line x1="250" y1="180" x2="340" y2="180" stroke="#c45c26" stroke-width="3"/>
  <text class="lab" x="262" y="204" font-weight="700">e.g. 98.5 mm</text>
  <text class="tiny" x="236" y="224">Enter Measured mm</text>

  <path class="arrow" d="M380 150 H410"/>

  <!-- Step 3 -->
  <rect class="box" x="416" y="70" width="150" height="160" rx="10"/>
  <circle class="accent" cx="440" cy="96" r="14"/>
  <text class="w" x="435" y="101">3</text>
  <text class="lab" x="462" y="102" font-weight="700">Compute</text>
  <text class="tiny" x="432" y="136">new = old ×</text>
  <text class="tiny" x="432" y="154">commanded / measured</text>
  <text class="tiny" x="432" y="184">Before: 250.000</text>
  <text class="lab" x="432" y="206" font-weight="700">After: 253.807</text>
  <text class="tiny" x="432" y="224">($100 / $101 / $102)</text>

  <path class="arrow" d="M576 150 H606"/>

  <!-- Step 4 -->
  <rect class="box" x="612" y="70" width="90" height="160" rx="10"/>
  <circle class="ok" cx="657" cy="120" r="18"/>
  <text class="w" x="651" y="125">4</text>
  <text class="lab" x="628" y="168" font-weight="700">Write</text>
  <text class="tiny" x="624" y="190">to GRBL</text>
  <text class="tiny" x="624" y="210">EEPROM</text>

  <text class="tiny" x="24" y="270">Tip: mark start and end with a pencil or use a digital caliper / dial indicator for better accuracy.</text>
  <text class="tiny" x="24" y="290">Repeat for Y and Z. Soft travel comes next in the wizard.</text>
  <text class="tiny" x="24" y="310">Safety: keep Z clear of clamps and stock while measuring XY.</text>
</svg>
