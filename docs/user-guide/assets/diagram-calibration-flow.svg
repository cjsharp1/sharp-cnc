<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
  <title id="t">Calibration measure flow</title>
  <desc id="d">Command move, measure with ruler, compute and write steps per mm</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .accent { fill: #b8862d; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; }
      .arrow { stroke: #3a4550; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .tiny { font-size: 12px; fill: #5a6570; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="360" rx="10"/>
  <text class="lab title" x="28" y="36">Steps/mm calibration flow</text>
  <text class="tiny" x="28" y="56">Command → measure → compute → write</text>

  <rect class="box" x="28" y="80" width="160" height="180" rx="12"/>
  <circle class="accent" cx="52" cy="108" r="15"/>
  <text class="w" x="52" y="108" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="lab" x="76" y="114" font-weight="700">Command</text>
  <text class="tiny" x="44" y="148">Pick axis + distance</text>
  <text class="tiny" x="44" y="168">(50 / 100 / 200 mm)</text>
  <text class="tiny" x="44" y="198">Press</text>
  <text class="lab" x="44" y="220" font-weight="700">Move +100 X</text>
  <text class="tiny" x="44" y="242">Machine jogs that far</text>

  <path class="arrow" d="M198 170 H230"/>

  <rect class="box" x="238" y="80" width="160" height="180" rx="12"/>
  <circle class="accent" cx="262" cy="108" r="15"/>
  <text class="w" x="262" y="108" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="lab" x="286" y="114" font-weight="700">Measure</text>
  <text class="tiny" x="254" y="148">Use a ruler / dial</text>
  <text class="tiny" x="254" y="168">on the real motion</text>
  <line x1="264" y1="198" x2="372" y2="198" stroke="#b8862d" stroke-width="3"/>
  <text class="lab" x="318" y="226" text-anchor="middle" font-weight="700">e.g. 98.5 mm</text>
  <text class="tiny" x="254" y="248">Enter Measured mm</text>

  <path class="arrow" d="M408 170 H440"/>

  <rect class="box" x="448" y="80" width="170" height="180" rx="12"/>
  <circle class="accent" cx="472" cy="108" r="15"/>
  <text class="w" x="472" y="108" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="lab" x="496" y="114" font-weight="700">Compute</text>
  <text class="tiny" x="464" y="150">new = old ×</text>
  <text class="tiny" x="464" y="170">commanded / measured</text>
  <text class="tiny" x="464" y="202">Before: 250.000</text>
  <text class="lab" x="464" y="226" font-weight="700">After: 253.807</text>
  <text class="tiny" x="464" y="248">($100 / $101 / $102)</text>

  <path class="arrow" d="M628 170 H660"/>

  <rect class="box" x="668" y="80" width="104" height="180" rx="12"/>
  <circle class="ok" cx="720" cy="130" r="18"/>
  <text class="w" x="720" y="130" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="lab" x="720" y="180" text-anchor="middle" font-weight="700">Write</text>
  <text class="tiny" x="720" y="204" text-anchor="middle">to GRBL</text>
  <text class="tiny" x="720" y="224" text-anchor="middle">EEPROM</text>

  <text class="tiny" x="28" y="296">Tip: mark start and end with a pencil, or use a digital caliper / dial indicator.</text>
  <text class="tiny" x="28" y="316">Repeat for Y and Z. Soft travel comes next in the wizard.</text>
  <text class="tiny" x="28" y="336">Safety: keep Z clear of clamps and stock while measuring XY.</text>
</svg>
