<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Calibrate phase flow</title>
  <desc id="d">Start, direction, steps/mm, speed &amp; accel, homing, soft travel, then Continue to Prepare</desc>
  <defs>
    <style>
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .accent { fill: #b8862d; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 12px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; }
      .arrow { stroke: #3a4550; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .tiny { font-size: 11px; fill: #5a6570; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="420" rx="10"/>
  <text class="lab title" x="24" y="34">Calibrate — Phase 1</text>
  <text class="tiny" x="24" y="52">Once per machine · then skip to Prepare next session</text>

  <!-- Row 1: steps 1–3 -->
  <rect class="box" x="20" y="72" width="140" height="130" rx="10"/>
  <circle class="accent" cx="42" cy="96" r="12"/>
  <text class="w" x="42" y="96" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="lab" x="60" y="100" font-weight="700">Start</text>
  <text class="tiny" x="34" y="128">Home ($H)</text>
  <text class="tiny" x="34" y="146">Confirm → Next</text>

  <path class="arrow" d="M168 135 H186"/>

  <rect class="box" x="194" y="72" width="140" height="130" rx="10"/>
  <circle class="accent" cx="216" cy="96" r="12"/>
  <text class="w" x="216" y="96" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="lab" x="234" y="100" font-weight="700">Direction</text>
  <text class="tiny" x="208" y="128">Z first · Write $3</text>
  <text class="tiny" x="208" y="146">Yes/No → Invert</text>

  <path class="arrow" d="M342 135 H360"/>

  <rect class="box" x="368" y="72" width="140" height="130" rx="10"/>
  <circle class="accent" cx="390" cy="96" r="12"/>
  <text class="w" x="390" y="96" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="lab" x="408" y="100" font-weight="700">Steps/mm</text>
  <text class="tiny" x="382" y="128">Move → measure</text>
  <text class="tiny" x="382" y="146">$100–$102</text>

  <!-- Row 2: steps 4–6 -->
  <rect class="box" x="20" y="230" width="200" height="130" rx="10"/>
  <circle class="accent" cx="42" cy="254" r="12"/>
  <text class="w" x="42" y="254" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="lab" x="60" y="258" font-weight="700">Speed &amp; accel</text>
  <text class="tiny" x="34" y="286">Out-and-back · ×0.75</text>
  <text class="tiny" x="34" y="304">$110–$112 / $120–$122</text>

  <path class="arrow" d="M228 293 H246"/>

  <rect class="box" x="254" y="230" width="200" height="130" rx="10"/>
  <circle class="accent" cx="276" cy="254" r="12"/>
  <text class="w" x="276" y="254" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="lab" x="294" y="258" font-weight="700">Homing</text>
  <text class="tiny" x="268" y="286">Switches · $22 · $H</text>
  <text class="tiny" x="268" y="304">Z homes first</text>

  <path class="arrow" d="M462 293 H480"/>

  <rect class="box" x="488" y="230" width="220" height="130" rx="10"/>
  <circle class="ok" cx="510" cy="254" r="12"/>
  <text class="w" x="510" y="254" text-anchor="middle" dominant-baseline="central">6</text>
  <text class="lab" x="528" y="258" font-weight="700">Soft travel</text>
  <text class="tiny" x="502" y="286">$130–$132 · $20 · Test limit</text>
  <text class="tiny" x="502" y="304">→ Prepare</text>

  <text class="tiny" x="24" y="390">After Soft travel confirm, next sessions open on Prepare. Soft limits protect the machine, not the work.</text>
  <text class="tiny" x="24" y="408">Safety: clear bed · keep Z high for XY · E-Stop ready · Virtual CNC first. Raw $$ under Menu → Advanced…</text>
</svg>
