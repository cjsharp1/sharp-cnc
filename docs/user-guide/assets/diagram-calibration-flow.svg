<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
  <title id="t">Calibrate phase flow</title>
  <desc id="d">Zero context, direction, steps per mm, soft travel, then Continue to Prepare</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .accent { fill: #b8862d; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; }
      .arrow { stroke: #3a4550; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .tiny { font-size: 12px; fill: #5a6570; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="360" rx="10"/>
  <text class="lab title" x="28" y="36">Calibrate — Phase 1</text>
  <text class="tiny" x="28" y="56">Once per machine · then skip to Prepare next session</text>

  <rect class="box" x="28" y="80" width="150" height="180" rx="12"/>
  <circle class="accent" cx="52" cy="108" r="15"/>
  <text class="w" x="52" y="108" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="lab" x="76" y="114" font-weight="700">Zero</text>
  <text class="tiny" x="44" y="148">Material / Machine</text>
  <text class="tiny" x="44" y="168">Optional Home ($H)</text>
  <text class="tiny" x="44" y="198">Confirm → Next</text>
  <text class="tiny" x="44" y="230">Measurement check</text>

  <path class="arrow" d="M188 170 H210"/>

  <rect class="box" x="218" y="80" width="150" height="180" rx="12"/>
  <circle class="accent" cx="242" cy="108" r="15"/>
  <text class="w" x="242" y="108" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="lab" x="266" y="114" font-weight="700">Direction</text>
  <text class="tiny" x="234" y="148">Invert wrong axes</text>
  <text class="tiny" x="234" y="168">Write $3</text>
  <text class="tiny" x="234" y="198">Test ±5 mm</text>
  <text class="tiny" x="234" y="230">+X right · +Y up</text>

  <path class="arrow" d="M378 170 H400"/>

  <rect class="box" x="408" y="80" width="150" height="180" rx="12"/>
  <circle class="accent" cx="432" cy="108" r="15"/>
  <text class="w" x="432" y="108" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="lab" x="456" y="114" font-weight="700">Steps/mm</text>
  <text class="tiny" x="424" y="148">Move → measure</text>
  <text class="tiny" x="424" y="168">Write $100–$102</text>
  <text class="tiny" x="424" y="198">old × cmd ÷ meas</text>
  <text class="tiny" x="424" y="230">X then Y then Z</text>

  <path class="arrow" d="M568 170 H590"/>

  <rect class="box" x="598" y="80" width="170" height="180" rx="12"/>
  <circle class="ok" cx="622" cy="108" r="15"/>
  <text class="w" x="622" y="108" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="lab" x="646" y="114" font-weight="700">Soft travel</text>
  <text class="tiny" x="614" y="148">Use MPos → write</text>
  <text class="tiny" x="614" y="168">$130–$132 + $20</text>
  <text class="tiny" x="614" y="198">Optional bed test</text>
  <text class="lab" x="614" y="230" font-weight="700" font-size="12">→ Prepare</text>

  <text class="tiny" x="28" y="296">Raw $$ edits live under Menu → Advanced… — not a Calibrate step.</text>
  <text class="tiny" x="28" y="316">After Soft travel confirm, next sessions open on Prepare.</text>
  <text class="tiny" x="28" y="336">Safety: clear bed · keep Z high for XY · E-Stop ready · Virtual CNC first.</text>
</svg>
