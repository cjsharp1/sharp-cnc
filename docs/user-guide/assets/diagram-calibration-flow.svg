<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">Calibrate phase flow</title>
  <desc id="d">Start, direction, steps/mm, speed &amp; accel, soft travel, then Continue to Prepare</desc>
  <defs>
    <style>
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .accent { fill: #b8862d; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 13px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; }
      .arrow { stroke: #3a4550; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .tiny { font-size: 11px; fill: #5a6570; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="360" rx="10"/>
  <text class="lab title" x="24" y="34">Calibrate — Phase 1</text>
  <text class="tiny" x="24" y="52">Once per machine · then skip to Prepare next session</text>

  <rect class="box" x="20" y="78" width="160" height="170" rx="10"/>
  <circle class="accent" cx="42" cy="104" r="14"/>
  <text class="w" x="42" y="104" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="lab" x="64" y="110" font-weight="700">Start</text>
  <text class="tiny" x="34" y="140">Home ($H)</text>
  <text class="tiny" x="34" y="158">Confirm → Next</text>

  <path class="arrow" d="M188 160 H206"/>

  <rect class="box" x="214" y="78" width="160" height="170" rx="10"/>
  <circle class="accent" cx="236" cy="104" r="14"/>
  <text class="w" x="236" y="104" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="lab" x="258" y="110" font-weight="700">Direction</text>
  <text class="tiny" x="228" y="140">Z first · Write $3</text>
  <text class="tiny" x="228" y="158">Yes/No → Invert</text>

  <path class="arrow" d="M382 160 H400"/>

  <rect class="box" x="408" y="78" width="160" height="170" rx="10"/>
  <circle class="accent" cx="430" cy="104" r="14"/>
  <text class="w" x="430" y="104" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="lab" x="452" y="110" font-weight="700">Steps/mm</text>
  <text class="tiny" x="422" y="140">Move → measure</text>
  <text class="tiny" x="422" y="158">$100–$102</text>

  <path class="arrow" d="M576 160 H594"/>

  <rect class="box" x="602" y="78" width="160" height="170" rx="10"/>
  <circle class="accent" cx="624" cy="104" r="14"/>
  <text class="w" x="624" y="104" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="lab" x="646" y="110" font-weight="700">Speed &amp; accel</text>
  <text class="tiny" x="616" y="140">Out-and-back</text>
  <text class="tiny" x="616" y="158">$110–$112 / $120–$122</text>
  <text class="tiny" x="616" y="176">×0.75 recommend</text>

  <path class="arrow" d="M770 160 H788"/>

  <rect class="box" x="796" y="78" width="144" height="170" rx="10"/>
  <circle class="ok" cx="818" cy="104" r="14"/>
  <text class="w" x="818" y="104" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="lab" x="838" y="110" font-weight="700">Travel</text>
  <text class="tiny" x="810" y="140">$130–$132</text>
  <text class="tiny" x="810" y="158">$20 · bed test</text>
  <text class="lab" x="810" y="200" font-weight="700" font-size="12">→ Prepare</text>

  <text class="tiny" x="24" y="290">Homing setup arrives in a later PR · raw $$ edits live under Menu → Advanced…</text>
  <text class="tiny" x="24" y="310">After Soft travel confirm, next sessions open on Prepare.</text>
  <text class="tiny" x="24" y="330">Safety: clear bed · keep Z high for XY · E-Stop ready · Virtual CNC first.</text>
</svg>
