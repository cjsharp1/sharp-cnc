<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="t d">
  <title id="t">Prepare to run wizard steps</title>
  <desc id="d">Stock, tool, XY zero, Z probe, safe Z, ready enables Start</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .accent { fill: #b8862d; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 13px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; }
      .arrow { stroke: #3a4550; stroke-width: 2; fill: none; marker-end: url(#a); }
      .tiny { font-size: 11px; fill: #5a6570; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="340" rx="10"/>
  <text class="lab title" x="28" y="36">Prepare to run — wizard steps</text>
  <text class="tiny" x="28" y="56">Required before Start when work zero is not confirmed this session</text>

  <!-- Step cards: body copy left-inset; badge numbers centered in circles; titles left under badge row -->
  <rect class="box" x="24" y="78" width="118" height="160" rx="10"/>
  <circle class="accent" cx="48" cy="104" r="14"/>
  <text class="w" x="48" y="104" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="lab" x="83" y="140" text-anchor="middle" font-weight="700">Stock</text>
  <text class="tiny" x="83" y="162" text-anchor="middle">Size / corner</text>
  <text class="tiny" x="83" y="180" text-anchor="middle">Clamped?</text>

  <path class="arrow" d="M150 158 H166"/>

  <rect class="box" x="174" y="78" width="118" height="160" rx="10"/>
  <circle class="accent" cx="198" cy="104" r="14"/>
  <text class="w" x="198" y="104" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="lab" x="233" y="140" text-anchor="middle" font-weight="700">Tool</text>
  <text class="tiny" x="233" y="162" text-anchor="middle">Bit type / Ø</text>
  <text class="tiny" x="233" y="180" text-anchor="middle">Tight?</text>

  <path class="arrow" d="M300 158 H316"/>

  <rect class="box" x="324" y="78" width="118" height="160" rx="10"/>
  <circle class="accent" cx="348" cy="104" r="14"/>
  <text class="w" x="348" y="104" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="lab" x="383" y="140" text-anchor="middle" font-weight="700">XY zero</text>
  <text class="tiny" x="383" y="162" text-anchor="middle">Jog to origin</text>
  <text class="tiny" x="383" y="180" text-anchor="middle">Zero XY</text>

  <path class="arrow" d="M450 158 H466"/>

  <rect class="box" x="474" y="78" width="118" height="160" rx="10"/>
  <circle class="accent" cx="498" cy="104" r="14"/>
  <text class="w" x="498" y="104" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="lab" x="533" y="140" text-anchor="middle" font-weight="700">Z probe</text>
  <text class="tiny" x="533" y="162" text-anchor="middle">G38.2 cycle</text>
  <text class="tiny" x="533" y="180" text-anchor="middle">or Manual Z</text>

  <path class="arrow" d="M600 158 H616"/>

  <rect class="box" x="624" y="78" width="100" height="160" rx="10"/>
  <circle class="accent" cx="646" cy="104" r="14"/>
  <text class="w" x="646" y="104" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="lab" x="674" y="140" text-anchor="middle" font-weight="700">Safe Z</text>
  <text class="tiny" x="674" y="162" text-anchor="middle">Retract</text>
  <text class="tiny" x="674" y="180" text-anchor="middle">Plate off</text>

  <path class="arrow" d="M732 158 H748"/>

  <rect class="box" x="756" y="78" width="80" height="160" rx="10"/>
  <circle class="ok" cx="796" cy="116" r="16"/>
  <text class="w" x="796" y="116" text-anchor="middle" dominant-baseline="central">6</text>
  <text class="lab" x="796" y="156" text-anchor="middle" font-weight="700">Ready</text>
  <text class="tiny" x="796" y="178" text-anchor="middle">Start</text>
  <text class="tiny" x="796" y="196" text-anchor="middle">unlocks</text>

  <text class="tiny" x="28" y="278">Open from Menu → Prepare to run… or Job → Prepare….</text>
  <text class="tiny" x="28" y="298">Loading a new job or disconnecting clears the ready flag — prepare again.</text>
  <text class="tiny" x="28" y="318">Simulate still works without Prepare; only live Start is gated.</text>
</svg>
