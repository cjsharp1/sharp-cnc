<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">Prepare to run wizard steps</title>
  <desc id="d">Stock, tool, XY zero, Z probe, safe Z, ready enables Start</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 1.75; }
      .accent { fill: #c45c26; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: system-ui,Segoe UI,sans-serif; fill: #1a2332; font-size: 12px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: system-ui,Segoe UI,sans-serif; font-size: 12px; font-weight: 700; }
      .arrow { stroke: #2c3e50; stroke-width: 2; fill: none; marker-end: url(#a); }
      .tiny { font-size: 10px; fill: #4a5568; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="280" rx="8"/>
  <text class="lab title" x="24" y="34">Prepare to run — wizard steps</text>

  <!-- 6 steps compact -->
  <rect class="box" x="16" y="58" width="100" height="140" rx="8"/>
  <circle class="accent" cx="36" cy="80" r="12"/>
  <text class="w" x="32" y="84">1</text>
  <text class="lab" x="28" y="110" font-weight="700">Stock</text>
  <text class="tiny" x="28" y="130">Size / corner</text>
  <text class="tiny" x="28" y="146">Clamped?</text>

  <path class="arrow" d="M120 128 H136"/>

  <rect class="box" x="140" y="58" width="100" height="140" rx="8"/>
  <circle class="accent" cx="160" cy="80" r="12"/>
  <text class="w" x="156" y="84">2</text>
  <text class="lab" x="152" y="110" font-weight="700">Tool</text>
  <text class="tiny" x="152" y="130">Bit type / Ø</text>
  <text class="tiny" x="152" y="146">Tight?</text>

  <path class="arrow" d="M244 128 H260"/>

  <rect class="box" x="264" y="58" width="100" height="140" rx="8"/>
  <circle class="accent" cx="284" cy="80" r="12"/>
  <text class="w" x="280" y="84">3</text>
  <text class="lab" x="276" y="110" font-weight="700">XY zero</text>
  <text class="tiny" x="276" y="130">Jog to origin</text>
  <text class="tiny" x="276" y="146">Zero XY</text>

  <path class="arrow" d="M368 128 H384"/>

  <rect class="box" x="388" y="58" width="100" height="140" rx="8"/>
  <circle class="accent" cx="408" cy="80" r="12"/>
  <text class="w" x="404" y="84">4</text>
  <text class="lab" x="400" y="110" font-weight="700">Z probe</text>
  <text class="tiny" x="400" y="130">G38.2 cycle</text>
  <text class="tiny" x="400" y="146">or Manual Z</text>

  <path class="arrow" d="M492 128 H508"/>

  <rect class="box" x="512" y="58" width="90" height="140" rx="8"/>
  <circle class="accent" cx="530" cy="80" r="12"/>
  <text class="w" x="526" y="84">5</text>
  <text class="lab" x="524" y="110" font-weight="700">Safe Z</text>
  <text class="tiny" x="524" y="130">Retract</text>
  <text class="tiny" x="524" y="146">Plate off</text>

  <path class="arrow" d="M606 128 H622"/>

  <rect class="box" x="626" y="58" width="78" height="140" rx="8"/>
  <circle class="ok" cx="665" cy="88" r="16"/>
  <text class="w" x="660" y="92">6</text>
  <text class="lab" x="640" y="128" font-weight="700">Ready</text>
  <text class="tiny" x="638" y="150">Start</text>
  <text class="tiny" x="638" y="166">unlocks</text>

  <text class="tiny" x="24" y="230">Open from Menu → Prepare to run… or Job → Prepare…. Required before Start when work zero is not confirmed this session.</text>
  <text class="tiny" x="24" y="250">Loading a new job or disconnecting clears the ready flag — prepare again.</text>
  <text class="tiny" x="24" y="270">Simulate still works without Prepare; only live Start is gated.</text>
</svg>
