<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="t d">
  <title id="t">Prepare phase wizard steps</title>
  <desc id="d">Stock plus tool, Material XY, Z probe, load, Mark ready unlocks Verify</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .accent { fill: #b8862d; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 13px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; }
      .arrow { stroke: #3a4550; stroke-width: 2; fill: none; marker-end: url(#a); }
      .tiny { font-size: 11px; fill: #5a6570; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="340" rx="10"/>
  <text class="lab title" x="28" y="36">Prepare — Phase 2 steps</text>
  <text class="tiny" x="28" y="56">One screen each · Mark ready unlocks Verify (not Start)</text>

  <rect class="box" x="24" y="78" width="130" height="160" rx="10"/>
  <circle class="accent" cx="48" cy="104" r="14"/>
  <text class="w" x="48" y="104" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="lab" x="89" y="140" text-anchor="middle" font-weight="700">Stock+tool</text>
  <text class="tiny" x="89" y="162" text-anchor="middle">W / L / T · bit</text>
  <text class="tiny" x="89" y="180" text-anchor="middle">NW NE / SW SE</text>

  <path class="arrow" d="M162 158 H178"/>

  <rect class="box" x="186" y="78" width="118" height="160" rx="10"/>
  <circle class="accent" cx="210" cy="104" r="14"/>
  <text class="w" x="210" y="104" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="lab" x="245" y="140" text-anchor="middle" font-weight="700">Material XY</text>
  <text class="tiny" x="245" y="162" text-anchor="middle">Jog · Zero XY</text>
  <text class="tiny" x="245" y="180" text-anchor="middle">+ compact jog</text>

  <path class="arrow" d="M312 158 H328"/>

  <rect class="box" x="336" y="78" width="118" height="160" rx="10"/>
  <circle class="accent" cx="360" cy="104" r="14"/>
  <text class="w" x="360" y="104" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="lab" x="395" y="140" text-anchor="middle" font-weight="700">Z probe</text>
  <text class="tiny" x="395" y="162" text-anchor="middle">G38.2 cycle</text>
  <text class="tiny" x="395" y="180" text-anchor="middle">or Manual Z</text>

  <path class="arrow" d="M462 158 H478"/>

  <rect class="box" x="486" y="78" width="110" height="160" rx="10"/>
  <circle class="accent" cx="510" cy="104" r="14"/>
  <text class="w" x="510" y="104" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="lab" x="541" y="140" text-anchor="middle" font-weight="700">Load</text>
  <text class="tiny" x="541" y="162" text-anchor="middle">.nc / SVG</text>
  <text class="tiny" x="541" y="180" text-anchor="middle">place path</text>

  <path class="arrow" d="M604 158 H620"/>

  <rect class="box" x="628" y="78" width="100" height="160" rx="10"/>
  <circle class="ok" cx="678" cy="116" r="16"/>
  <text class="w" x="678" y="116" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="lab" x="678" y="156" text-anchor="middle" font-weight="700">Ready</text>
  <text class="tiny" x="678" y="178" text-anchor="middle">→ Verify</text>
  <text class="tiny" x="678" y="196" text-anchor="middle">not Start</text>

  <text class="tiny" x="28" y="278">Phase switcher → Prepare · or Menu → Prepare phase…</text>
  <text class="tiny" x="28" y="298">Loading a new job or disconnecting clears the ready flag — prepare again.</text>
  <text class="tiny" x="28" y="318">Simulate works without Prepare; live Start stays gated until Verify.</text>
</svg>
