<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t d">
  <title id="t">USB connection path</title>
  <desc id="d">PC to USB to Demon Shield Arduino to CNC motors</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .lab { font-family: system-ui,Segoe UI,sans-serif; fill: #1a2332; font-size: 13px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-weight: 700; }
      .tiny { font-size: 11px; fill: #4a5568; }
      .line { stroke: #2c3e50; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .accent { fill: #c45c26; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect class="bg" width="640" height="260" rx="8"/>
  <text class="lab title" x="24" y="36">First connection (Windows desktop)</text>

  <rect class="box" x="30" y="80" width="120" height="90" rx="10"/>
  <text class="lab" x="58" y="122" font-weight="700">PC</text>
  <text class="tiny" x="46" y="142">SharpCNC</text>
  <text class="tiny" x="42" y="158">Tauri desktop</text>

  <path class="line" d="M160 125 H200"/>
  <text class="tiny" x="168" y="112">USB</text>

  <rect class="box" x="210" y="80" width="140" height="90" rx="10"/>
  <text class="lab" x="230" y="118" font-weight="700">Demon Shield</text>
  <text class="tiny" x="238" y="140">Arduino + GRBL</text>
  <text class="tiny" x="248" y="158">COM port</text>

  <path class="line" d="M360 125 H400"/>

  <rect class="box" x="410" y="80" width="190" height="90" rx="10"/>
  <text class="lab" x="458" y="122" font-weight="700">Your CNC</text>
  <text class="tiny" x="440" y="142">Motors · spindle · switches</text>
  <text class="tiny" x="455" y="158">Baud 115200</text>

  <rect class="accent" x="30" y="200" width="580" height="40" rx="8"/>
  <text class="lab w" x="50" y="225">Refresh ports → select COM → Connect → status becomes Linked</text>
</svg>
