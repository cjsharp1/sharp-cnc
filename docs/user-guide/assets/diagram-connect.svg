<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
  <title id="t">USB connection path</title>
  <desc id="d">PC to USB to Demon Shield Arduino to CNC motors</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; }
      .title { font-size: 18px; font-weight: 700; }
      .w { fill: #ffffff; font-weight: 700; }
      .tiny { font-size: 12px; fill: #5a6570; }
      .line { stroke: #3a4550; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .accent { fill: #b8862d; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>

  <rect class="bg" width="760" height="300" rx="10"/>
  <text class="lab title" x="28" y="36">First connection (Windows desktop)</text>
  <text class="tiny" x="28" y="56">USB serial path from SharpCNC to the machine</text>

  <rect class="box" x="36" y="88" width="150" height="100" rx="10"/>
  <text class="lab" x="111" y="128" font-weight="700" text-anchor="middle">PC</text>
  <text class="tiny" x="111" y="150" text-anchor="middle">SharpCNC</text>
  <text class="tiny" x="111" y="168" text-anchor="middle">Tauri desktop</text>

  <path class="line" d="M196 138 H236"/>
  <text class="tiny" x="204" y="124">USB</text>

  <rect class="box" x="244" y="88" width="180" height="100" rx="10"/>
  <text class="lab" x="334" y="128" font-weight="700" text-anchor="middle">Demon Shield</text>
  <text class="tiny" x="334" y="150" text-anchor="middle">Arduino + GRBL</text>
  <text class="tiny" x="334" y="168" text-anchor="middle">COM port</text>

  <path class="line" d="M434 138 H474"/>

  <rect class="box" x="482" y="88" width="240" height="100" rx="10"/>
  <text class="lab" x="602" y="128" font-weight="700" text-anchor="middle">Your CNC</text>
  <text class="tiny" x="602" y="150" text-anchor="middle">Motors · spindle · switches</text>
  <text class="tiny" x="602" y="168" text-anchor="middle">Baud 115200</text>

  <rect class="accent" x="36" y="224" width="686" height="48" rx="10"/>
  <text class="lab w" x="56" y="254">Refresh ports → select COM → Connect → status becomes Linked</text>
</svg>
