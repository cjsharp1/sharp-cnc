<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Calibration 1 — Before you start</title>
  <desc id="d">Home the machine, confirm positions look right, then Next into direction</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .card { fill: #ffffff; stroke: #3a4550; stroke-width: 2.5; }
      .num { fill: #b8862d; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 18px; }
      .big { font-size: 28px; font-weight: 700; }
      .act { font-size: 22px; font-weight: 700; }
      .tiny { font-size: 14px; fill: #5a6570; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-weight: 700; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a2332; font-size: 20px; }
      .btn { fill: #b8862d; }
      .ok { fill: #1f6a4a; }
      .panel { fill: #fff4eb; stroke: #b85c2a; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" width="960" height="520" rx="12"/>
  <circle class="num" cx="56" cy="56" r="28"/>
  <text class="w" x="56" y="56" text-anchor="middle" dominant-baseline="central" font-size="24">1</text>
  <text class="lab big" x="100" y="50">Before you start</text>
  <text class="lab act" x="100" y="84">Clear bed → Home ($H) → confirm → Next</text>

  <rect class="card" x="80" y="140" width="380" height="220" rx="14"/>
  <text class="lab" x="270" y="185" text-anchor="middle" font-weight="700">Machine (after Home)</text>
  <text class="mono" x="270" y="235" text-anchor="middle">X ≈ 0</text>
  <text class="mono" x="270" y="275" text-anchor="middle">Y ≈ 0</text>
  <text class="mono" x="270" y="315" text-anchor="middle">Z ≈ −1</text>
  <text class="tiny" x="270" y="345" text-anchor="middle">Z near 0 at top; more negative = down</text>

  <rect class="panel" x="500" y="140" width="380" height="220" rx="14"/>
  <text class="lab" x="690" y="185" text-anchor="middle" font-weight="700">This step</text>
  <text class="tiny" x="540" y="225">• Back up settings first (meta bar)</text>
  <text class="tiny" x="540" y="255">• Home once per power-on</text>
  <text class="tiny" x="540" y="285">• Position panel is always-on chrome</text>
  <text class="tiny" x="540" y="315">• Material zero optional here</text>
  <text class="tiny" x="540" y="345">• Then Direction → … → Soft travel</text>

  <rect class="btn" x="240" y="400" width="480" height="50" rx="10"/>
  <text class="w" x="480" y="425" text-anchor="middle" dominant-baseline="central" font-size="18">Machine homed — Next</text>
</svg>
