<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="t d">
  <title id="t">SharpCNC setup order overview</title>
  <desc id="d">Connect, Calibrate once, Prepare every job, Verify, Run</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .box { fill: #ffffff; stroke: #3a4550; stroke-width: 2.5; }
      .c0 { fill: #5a6570; }
      .cal { fill: #b8862d; }
      .job { fill: #2f5d7a; }
      .ver { fill: #1f6a4a; }
      .run { fill: #b85c2a; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 14px; font-weight: 700; }
      .tiny { font-size: 11px; fill: #5a6570; font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-weight: 700; font-size: 13px; }
      .arrow { stroke: #3a4550; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="280" rx="12"/>
  <text class="lab" x="32" y="40" font-size="20">Order of operations</text>
  <text class="tiny" x="32" y="62">Connect → Calibrate (once) → Prepare → Verify → Run</text>

  <g transform="translate(24,100)">
    <rect class="box" width="150" height="110" rx="12"/>
    <rect class="c0" width="150" height="32" rx="12"/>
    <rect class="c0" y="20" width="150" height="12"/>
    <text class="w" x="75" y="16" text-anchor="middle" dominant-baseline="central">0</text>
    <text class="lab" x="75" y="62" text-anchor="middle">Connect</text>
    <text class="tiny" x="75" y="86" text-anchor="middle">Virtual / COM</text>
  </g>
  <path class="arrow" d="M184 155 H204"/>
  <g transform="translate(212,100)">
    <rect class="box" width="150" height="110" rx="12"/>
    <rect class="cal" width="150" height="32" rx="12"/>
    <rect class="cal" y="20" width="150" height="12"/>
    <text class="w" x="75" y="16" text-anchor="middle" dominant-baseline="central">1 · Once</text>
    <text class="lab" x="75" y="62" text-anchor="middle">Calibrate</text>
    <text class="tiny" x="75" y="86" text-anchor="middle">6 steps · then Prepare</text>
  </g>
  <path class="arrow" d="M372 155 H392"/>
  <g transform="translate(400,100)">
    <rect class="box" width="150" height="110" rx="12"/>
    <rect class="job" width="150" height="32" rx="12"/>
    <rect class="job" y="20" width="150" height="12"/>
    <text class="w" x="75" y="16" text-anchor="middle" dominant-baseline="central">2 · Job</text>
    <text class="lab" x="75" y="62" text-anchor="middle">Prepare</text>
    <text class="tiny" x="75" y="86" text-anchor="middle">Stock · zeros · load</text>
  </g>
  <path class="arrow" d="M560 155 H580"/>
  <g transform="translate(588,100)">
    <rect class="box" width="150" height="110" rx="12"/>
    <rect class="ver" width="150" height="32" rx="12"/>
    <rect class="ver" y="20" width="150" height="12"/>
    <text class="w" x="75" y="16" text-anchor="middle" dominant-baseline="central">3</text>
    <text class="lab" x="75" y="62" text-anchor="middle">Verify</text>
    <text class="tiny" x="75" y="86" text-anchor="middle">Simulate → Start</text>
  </g>
  <path class="arrow" d="M748 155 H768"/>
  <g transform="translate(776,100)">
    <rect class="box" width="150" height="110" rx="12"/>
    <rect class="run" width="150" height="32" rx="12"/>
    <rect class="run" y="20" width="150" height="12"/>
    <text class="w" x="75" y="16" text-anchor="middle" dominant-baseline="central">4</text>
    <text class="lab" x="75" y="62" text-anchor="middle">Run</text>
    <text class="tiny" x="75" y="86" text-anchor="middle">Overrides · stop</text>
  </g>
  <text class="tiny" x="32" y="250">First-run bootstraps Connect → home → Calibrate; later sessions open on Prepare</text>
</svg>
