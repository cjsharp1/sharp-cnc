<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Phase 0 — Virtual CNC first</title>
  <desc id="d">Practice on Virtual CNC before real USB: Connect → Calibrate → Prepare → Verify dry-run</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .card { fill: #ffffff; stroke: #3a4550; stroke-width: 2.5; }
      .num { fill: #5a6570; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 18px; }
      .big { font-size: 28px; font-weight: 700; }
      .act { font-size: 20px; font-weight: 700; }
      .tiny { font-size: 14px; fill: #5a6570; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-weight: 700; }
      .chip { fill: #1a2332; }
      .ok { fill: #1f6a4a; }
      .hint { fill: #2f5d7a; }
    </style>
  </defs>
  <rect class="bg" width="960" height="520" rx="12"/>
  <circle class="num" cx="56" cy="56" r="28"/>
  <text class="w" x="56" y="56" text-anchor="middle" dominant-baseline="central" font-size="24">0</text>
  <text class="lab big" x="100" y="50">Virtual CNC first</text>
  <text class="lab act" x="100" y="84">Practice before real USB · same port list</text>

  <rect class="card" x="80" y="130" width="380" height="220" rx="14"/>
  <text class="lab" x="110" y="175" font-size="20">Port list</text>
  <g transform="translate(110,200)">
    <rect class="hint" width="320" height="44" rx="8"/>
    <text class="w" x="160" y="22" text-anchor="middle" dominant-baseline="central" font-size="16">Virtual CNC ★ practice</text>
  </g>
  <g transform="translate(110,258)">
    <rect class="chip" width="320" height="44" rx="8"/>
    <text class="w" x="160" y="22" text-anchor="middle" dominant-baseline="central" font-size="15">COM3 · Demon Shield</text>
  </g>
  <text class="tiny" x="110" y="330">Hint: “Practice here before the real machine.”</text>

  <rect class="card" x="500" y="130" width="360" height="220" rx="14"/>
  <text class="lab" x="530" y="175" font-size="20">Safe practice path</text>
  <text class="tiny" x="530" y="210">1 · Connect (Virtual)</text>
  <text class="tiny" x="530" y="238">2 · Calibrate once</text>
  <text class="tiny" x="530" y="266">3 · Prepare → Mark ready</text>
  <text class="tiny" x="530" y="294">4 · Verify dry-run / Simulate</text>
  <text class="tiny" x="530" y="322">Then real COM when ready</text>

  <rect class="ok" x="80" y="380" width="780" height="90" rx="14"/>
  <text class="w" x="470" y="418" text-anchor="middle" dominant-baseline="central" font-size="22">Status = Virtual</text>
  <text class="w" x="470" y="448" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500">Material / Machine XYZ update · no real motors</text>
</svg>
