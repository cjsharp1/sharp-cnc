<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Z probe with touch plate</title>
  <desc id="d">Clip on bit, plate on stock, G38.2 seek, remove plate</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .panel { fill: #ffffff; stroke: #3a4550; stroke-width: 2.5; }
      .stock { fill: #c4a574; stroke: #6b4f2a; stroke-width: 2.5; }
      .plate { fill: #8a9aa8; stroke: #3a4550; stroke-width: 2; }
      .bit { fill: #3a4550; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 18px; font-weight: 700; }
      .tiny { font-size: 14px; fill: #5a6570; font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-weight: 700; }
      .accent { fill: #b8862d; }
      .warn { fill: #c45c4a; }
      .arrow { stroke: #3a4550; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4550"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" rx="12"/>
  <text class="lab" x="40" y="48">Every job · Z probe</text>
  <text class="tiny" x="40" y="74">Plate on stock · clip on bit · Run Z probe · remove plate</text>

  <rect class="stock" x="120" y="280" width="360" height="120" rx="4"/>
  <rect class="plate" x="220" y="250" width="140" height="30" rx="4"/>
  <rect class="bit" x="280" y="140" width="20" height="110" rx="2"/>
  <path class="arrow" d="M290 130 V155"/>
  <text class="tiny" x="310" y="150">Seek down G38.2</text>
  <text class="tiny" x="240" y="240">Touch plate</text>
  <text class="tiny" x="280" y="430" text-anchor="middle">Stock top = work Z0 after thickness offset</text>

  <rect class="panel" x="560" y="140" width="340" height="300" rx="12"/>
  <circle class="accent" cx="596" cy="180" r="18"/>
  <text class="w" x="596" y="180" text-anchor="middle" dominant-baseline="central" font-size="14">4</text>
  <text class="lab" x="630" y="186" font-size="16">Z probe</text>
  <text class="tiny" x="588" y="230">Enter plate thickness</text>
  <text class="tiny" x="588" y="260">Run Z probe</text>
  <text class="tiny" x="588" y="290">Work Z → stock face</text>
  <circle class="warn" cx="596" cy="340" r="10"/>
  <text class="lab" x="620" y="346" font-size="15">Remove plate</text>
  <text class="tiny" x="588" y="380">before Start / cut</text>
  <text class="tiny" x="588" y="410">Safe Z step confirms clear</text>
</svg>
