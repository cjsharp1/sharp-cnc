<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Confirm stock on bed</title>
  <desc id="d">Stock rectangle on the machine bed with width length thickness</desc>
  <defs>
    <style>
      .bg { fill: #f1f3f5; }
      .bed { fill: #dfe3e8; stroke: #3a4550; stroke-width: 3; }
      .stock { fill: #c4a574; stroke: #6b4f2a; stroke-width: 2.5; }
      .panel { fill: #ffffff; stroke: #3a4550; stroke-width: 2.5; }
      .lab { font-family: system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 18px; font-weight: 700; }
      .tiny { font-size: 14px; fill: #5a6570; font-family: system-ui, "Segoe UI", sans-serif; }
      .w { fill: #ffffff; font-family: system-ui, "Segoe UI", sans-serif; font-weight: 700; }
      .accent { fill: #b8862d; }
    </style>
  </defs>
  <rect class="bg" width="960" height="520" rx="12"/>
  <text class="lab" x="40" y="48">Every job · Confirm stock</text>
  <text class="tiny" x="40" y="74">Width × length × thickness + corner on the bed</text>

  <rect class="bed" x="80" y="120" width="520" height="340" rx="8"/>
  <text class="tiny" x="100" y="150">Machine bed</text>
  <rect class="stock" x="140" y="200" width="260" height="180" rx="4"/>
  <text class="lab" x="270" y="290" text-anchor="middle" font-size="16">Stock</text>
  <text class="tiny" x="270" y="314" text-anchor="middle">SW corner example</text>

  <rect class="panel" x="640" y="160" width="260" height="260" rx="12"/>
  <circle class="accent" cx="676" cy="200" r="18"/>
  <text class="w" x="676" y="206" text-anchor="middle" font-size="14">1</text>
  <text class="lab" x="710" y="206" font-size="16">Prepare</text>
  <text class="tiny" x="668" y="250">Width X</text>
  <text class="lab" x="668" y="278" font-size="20">400 mm</text>
  <text class="tiny" x="668" y="318">Length Y</text>
  <text class="lab" x="668" y="346" font-size="20">300 mm</text>
  <text class="tiny" x="668" y="386">Thickness Z</text>
  <text class="lab" x="668" y="414" font-size="20">18 mm</text>
</svg>
