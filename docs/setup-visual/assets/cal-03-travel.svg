<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Calibration 3 — Soft travel</title>
  <desc id="d">Jog to far end, Use MPos or type max, enable $20</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .bed { fill: #d8e0e8; stroke: #3a4550; stroke-width: 3; }
      .soft { fill: rgba(184, 92, 42, 0.08); stroke: #b85c2a; stroke-width: 3; stroke-dasharray: 10 7; }
      .sw { fill: #1f6a4a; }
      .num { fill: #b8862d; }
      .card { fill: #ffffff; stroke: #3a4550; stroke-width: 2.5; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 18px; }
      .big { font-size: 28px; font-weight: 700; }
      .act { font-size: 22px; font-weight: 700; }
      .tiny { font-size: 14px; fill: #5a6570; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-weight: 700; }
      .btn { fill: #b8862d; }
      .warn { fill: #b85c2a; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect class="bg" width="960" height="520" rx="12"/>
  <circle class="num" cx="56" cy="56" r="28"/>
  <text class="w" x="56" y="56" text-anchor="middle" dominant-baseline="central" font-size="24">3</text>
  <text class="lab big" x="100" y="50">Soft travel</text>
  <text class="lab act" x="100" y="84">Jog far → Use MPos → Write travel + $20</text>

  <rect class="bed" x="80" y="140" width="360" height="300" rx="10"/>
  <rect class="soft" x="110" y="170" width="280" height="230" rx="6"/>
  <circle class="sw" cx="130" cy="380" r="12"/>
  <text class="tiny" x="150" y="385">home</text>
  <circle fill="#3a4550" cx="360" cy="200" r="10"/>
  <text class="lab warn" x="300" y="185" font-weight="700" font-size="14">Stop here</text>
  <text class="tiny" x="260" y="300" text-anchor="middle">Soft envelope</text>
  <text class="tiny" x="260" y="325" text-anchor="middle">no far switches</text>

  <rect class="card" x="500" y="140" width="380" height="300" rx="14"/>
  <text class="lab" x="690" y="190" text-anchor="middle" font-weight="700">Max travel</text>
  <text class="lab mono" x="540" y="240" font-size="16">$130 X · $131 Y · $132 Z</text>
  <text class="tiny" x="690" y="280" text-anchor="middle">Use MPos or type measured size</text>
  <text class="tiny" x="690" y="310" text-anchor="middle">Enable soft limits ($20=1)</text>
  <rect class="btn" x="560" y="350" width="260" height="48" rx="10"/>
  <text class="w" x="690" y="374" text-anchor="middle" dominant-baseline="central" font-size="16">Write travel + $20</text>
</svg>
