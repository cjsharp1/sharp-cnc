<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">XY work zero</title>
  <desc id="d">Jog bit to job origin then Zero XY</desc>
  <defs>
    <style>
      .bg { fill: #f1f3f5; }
      .bed { fill: #dfe3e8; stroke: #3a4550; stroke-width: 3; }
      .stock { fill: #c4a574; stroke: #6b4f2a; stroke-width: 2.5; }
      .panel { fill: #ffffff; stroke: #3a4550; stroke-width: 2.5; }
      .lab { font-family: system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 18px; font-weight: 700; }
      .tiny { font-size: 14px; fill: #5a6570; font-family: system-ui, "Segoe UI", sans-serif; }
      .w { fill: #ffffff; font-family: system-ui, "Segoe UI", sans-serif; font-weight: 700; }
      .accent { fill: #b8862d; }
      .origin { fill: #2f5d7a; }
      .cross { stroke: #2f5d7a; stroke-width: 3; }
    </style>
  </defs>
  <rect class="bg" width="960" height="520" rx="12"/>
  <text class="lab" x="40" y="48">Every job · XY work zero</text>
  <text class="tiny" x="40" y="74">Jog to job origin → Zero XY (G10 L20)</text>

  <rect class="bed" x="80" y="120" width="520" height="340" rx="8"/>
  <rect class="stock" x="160" y="180" width="300" height="220" rx="4"/>
  <line class="cross" x1="160" y1="400" x2="200" y2="400"/>
  <line class="cross" x1="160" y1="400" x2="160" y2="360"/>
  <circle class="origin" cx="160" cy="400" r="10"/>
  <text class="lab" x="190" y="430" font-size="15">Work zero (0,0)</text>

  <rect class="panel" x="640" y="180" width="260" height="220" rx="12"/>
  <circle class="accent" cx="676" cy="220" r="18"/>
  <text class="w" x="676" y="226" text-anchor="middle" font-size="14">3</text>
  <text class="lab" x="710" y="226" font-size="16">XY zero</text>
  <text class="tiny" x="668" y="270">1. Jog tip to corner</text>
  <text class="tiny" x="668" y="300">2. Tap Zero XY</text>
  <text class="tiny" x="668" y="330">3. Work X/Y → 0.00</text>
  <text class="lab" x="668" y="380" font-size="16">Then Z probe →</text>
</svg>
