<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Step 2 — Home</title>
  <desc id="d">Clear bed, Home using zero-side limit switches only</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .bed { fill: #d8e0e8; stroke: #3a4550; stroke-width: 3; }
      .num { fill: #b8862d; }
      .sw { fill: #1f6a4a; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 18px; }
      .big { font-size: 28px; font-weight: 700; }
      .act { font-size: 22px; font-weight: 700; }
      .tiny { font-size: 14px; fill: #5a6570; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-weight: 700; }
      .arrow { stroke: #b8862d; stroke-width: 4; fill: none; marker-end: url(#a); }
      .btn { fill: #b8862d; }
      .warn { fill: #b85c2a; }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#b8862d"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" rx="12"/>
  <circle class="num" cx="56" cy="56" r="28"/>
  <text class="w" x="56" y="64" text-anchor="middle" font-size="24">2</text>
  <text class="lab big" x="100" y="50">Home</text>
  <text class="lab act" x="100" y="84">Clear bed → Home ($H) → wait Idle</text>

  <rect class="bed" x="120" y="130" width="420" height="270" rx="10"/>
  <text class="tiny" x="140" y="158">Machine bed</text>

  <!-- L-shaped home switches at zero corner; labels outside bed -->
  <circle class="sw" cx="160" cy="360" r="14"/>
  <rect class="sw" x="148" y="210" width="12" height="140" rx="2"/>
  <rect class="sw" x="160" y="348" width="140" height="12" rx="2"/>

  <path class="arrow" d="M360 250 L200 340"/>
  <circle fill="#3a4550" cx="360" cy="250" r="10"/>
  <text class="tiny" x="372" y="240">tool</text>

  <text class="tiny warn" x="340" y="190" text-anchor="middle">Far side = no switches</text>
  <text class="tiny warn" x="340" y="210" text-anchor="middle">(soft travel later)</text>

  <text class="lab" x="160" y="440" font-weight="700" font-size="16" fill="#1f6a4a">Home switches</text>
  <text class="tiny" x="160" y="462">zero side only</text>

  <rect class="btn" x="600" y="220" width="280" height="90" rx="14"/>
  <text class="w" x="740" y="275" text-anchor="middle" font-size="24">Home ($H)</text>

  <text class="lab" x="740" y="360" text-anchor="middle" font-weight="700">MPos → 0, 0, 0</text>
  <text class="tiny" x="740" y="390" text-anchor="middle">Session: Homed</text>
</svg>
