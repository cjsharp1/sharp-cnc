<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Calibration 3 — Steps per mm</title>
  <desc id="d">Command move, measure with ruler, write new steps/mm</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .card { fill: #ffffff; stroke: #3a4550; stroke-width: 2.5; }
      .num { fill: #b8862d; }
      .ok { fill: #1f6a4a; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 16px; }
      .big { font-size: 28px; font-weight: 700; }
      .act { font-size: 22px; font-weight: 700; }
      .tiny { font-size: 13px; fill: #5a6570; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-weight: 700; }
      .arrow { stroke: #3a4550; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a4550"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" rx="12"/>
  <circle class="num" cx="56" cy="56" r="28"/>
  <text class="w" x="56" y="56" text-anchor="middle" dominant-baseline="central" font-size="24">3</text>
  <text class="lab big" x="100" y="50" font-size="28">Steps/mm</text>
  <text class="lab act" x="100" y="84" font-size="22">Move → measure → write $100 / $101 / $102</text>

  <rect class="card" x="60" y="140" width="190" height="280" rx="12"/>
  <circle class="num" cx="155" cy="185" r="22"/>
  <text class="w" x="155" y="185" text-anchor="middle" dominant-baseline="central" font-size="18">A</text>
  <text class="lab" x="155" y="240" text-anchor="middle" font-weight="700">Command</text>
  <text class="tiny" x="155" y="270" text-anchor="middle">Move +100 X</text>
  <text class="tiny" x="155" y="295" text-anchor="middle">(50 / 100 / 200)</text>

  <path class="arrow" d="M260 280 H300"/>

  <rect class="card" x="310" y="140" width="190" height="280" rx="12"/>
  <circle class="num" cx="405" cy="185" r="22"/>
  <text class="w" x="405" y="185" text-anchor="middle" dominant-baseline="central" font-size="18">B</text>
  <text class="lab" x="405" y="240" text-anchor="middle" font-weight="700">Measure</text>
  <line x1="340" y1="280" x2="470" y2="280" stroke="#b8862d" stroke-width="4"/>
  <text class="lab" x="405" y="320" text-anchor="middle" font-weight="700">98.5 mm</text>
  <text class="tiny" x="405" y="350" text-anchor="middle">ruler / dial</text>

  <path class="arrow" d="M510 280 H550"/>

  <rect class="card" x="560" y="140" width="190" height="280" rx="12"/>
  <circle class="num" cx="655" cy="185" r="22"/>
  <text class="w" x="655" y="185" text-anchor="middle" dominant-baseline="central" font-size="18">C</text>
  <text class="lab" x="655" y="240" text-anchor="middle" font-weight="700">Compute</text>
  <text class="tiny" x="655" y="280" text-anchor="middle">old × cmd / meas</text>
  <text class="lab" x="655" y="320" text-anchor="middle" font-weight="700">new steps</text>

  <path class="arrow" d="M760 280 H800"/>

  <rect class="card" x="810" y="140" width="110" height="280" rx="12"/>
  <circle class="ok" cx="865" cy="185" r="22"/>
  <text class="w" x="865" y="185" text-anchor="middle" dominant-baseline="central" font-size="18">D</text>
  <text class="lab" x="865" y="260" text-anchor="middle" font-weight="700">Write</text>
  <text class="tiny" x="865" y="300" text-anchor="middle">to GRBL</text>
</svg>
