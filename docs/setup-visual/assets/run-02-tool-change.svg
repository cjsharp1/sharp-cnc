<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">Phase 4 — Tool change (M6)</title>
  <desc id="d">Spindle stopped, change the bit, re-probe Z, then Continue</desc>
  <defs>
    <style>
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .card { fill: #ffffff; stroke: #3a4550; stroke-width: 2.5; }
      .panel { fill: #fff8ee; stroke: #b8862d; stroke-width: 2.5; }
      .num { fill: #b85c2a; }
      .lab { fill: #1a2332; font-size: 18px; font-weight: 700; }
      .tiny { font-size: 13px; fill: #5a6570; }
      .w { fill: #ffffff; font-weight: 700; }
      .step { fill: #1a2332; font-size: 15px; font-weight: 600; }
      .done { fill: #1f6a4a; }
      .btn { fill: #2f5d7a; }
      .btnGhost { fill: #ffffff; stroke: #3a4550; stroke-width: 2; }
      .go { fill: #1f6a4a; }
      .dot { fill: #b8862d; }
    </style>
  </defs>
  <rect class="bg" width="960" height="360" rx="12"/>
  <circle class="num" cx="56" cy="48" r="24"/>
  <text class="w" x="56" y="48" text-anchor="middle" dominant-baseline="central" font-size="18">M6</text>
  <text class="lab" x="96" y="42" font-size="26">Tool change</text>
  <text class="tiny" x="96" y="68">Idle → M5 → change bit → re-probe Z → restore spindle → Continue</text>

  <rect class="panel" x="60" y="100" width="840" height="200" rx="14"/>
  <text class="lab" x="90" y="140" font-size="16">Tool change (M6) at line 48</text>

  <text class="step done" x="90" y="180">Spindle stopped ✓</text>
  <circle class="dot" cx="268" cy="175" r="3"/>
  <text class="step" x="286" y="180">Change the bit</text>
  <circle class="dot" cx="448" cy="175" r="3"/>
  <text class="step" x="466" y="180">Re-probe Z</text>
  <circle class="dot" cx="590" cy="175" r="3"/>
  <text class="step" x="608" y="180">Continue</text>

  <rect class="btnGhost" x="90" y="210" width="140" height="40" rx="8"/>
  <text x="160" y="235" text-anchor="middle" fill="#1a2332" font-size="14" font-weight="700">Re-probe Z</text>

  <rect x="250" y="220" width="18" height="18" rx="3" fill="#ffffff" stroke="#3a4550" stroke-width="2"/>
  <text class="tiny" x="278" y="234" fill="#1a2332">Same tool length</text>

  <rect class="go" x="720" y="210" width="140" height="40" rx="8"/>
  <text class="w" x="790" y="235" text-anchor="middle" font-size="14">Continue</text>

  <text class="tiny" x="90" y="275">Continue stays off until Z is re-probed or Same tool length is ticked.</text>
</svg>
