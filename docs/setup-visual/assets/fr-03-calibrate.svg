<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Step 3 — Calibrate</title>
  <desc id="d">Open Calibration wizard for direction and steps per mm</desc>
  <defs>
    <style>
      /* SharpCNC diagram type: UI stack on all text; avoid SVG Times default on .tiny/etc. */
      text, tspan { font-family: "Sora", system-ui, "Segoe UI", sans-serif; }
      .bg { fill: #f1f3f5; }
      .card { fill: #ffffff; stroke: #3a4550; stroke-width: 2.5; }
      .num { fill: #b8862d; }
      .lab { font-family: "Sora", system-ui, "Segoe UI", sans-serif; fill: #1a2332; font-size: 18px; }
      .big { font-size: 28px; font-weight: 700; }
      .act { font-size: 22px; font-weight: 700; }
      .tiny { font-size: 14px; fill: #5a6570; }
      .w { fill: #ffffff; font-family: "Sora", system-ui, "Segoe UI", sans-serif; font-weight: 700; }
      .pill { fill: #e8eef3; stroke: #3a4550; stroke-width: 2; }
      .btn { fill: #b8862d; }
      .arrow { stroke: #3a4550; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a4550"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="520" rx="12"/>
  <circle class="num" cx="56" cy="56" r="28"/>
  <text class="w" x="56" y="64" text-anchor="middle" font-size="24">3</text>
  <text class="lab big" x="100" y="50">Calibrate</text>
  <text class="lab act" x="100" y="84">Open Calibration… → direction + steps/mm</text>

  <rect class="card" x="100" y="140" width="340" height="280" rx="14"/>
  <text class="lab" x="270" y="190" text-anchor="middle" font-weight="700">First-run wizard</text>
  <rect class="btn" x="150" y="230" width="240" height="70" rx="10"/>
  <text class="w" x="270" y="275" text-anchor="middle" font-size="20">Open Calibration…</text>
  <text class="tiny" x="270" y="340" text-anchor="middle">Come back when done</text>
  <text class="tiny" x="270" y="365" text-anchor="middle">Travel is next</text>

  <path class="arrow" d="M460 280 H520"/>

  <rect class="card" x="540" y="140" width="340" height="280" rx="14"/>
  <text class="lab" x="710" y="185" text-anchor="middle" font-weight="700">Calibration covers</text>
  <rect class="pill" x="570" y="210" width="280" height="48" rx="8"/>
  <text class="lab" x="710" y="240" text-anchor="middle" font-size="15">$3 direction invert</text>
  <rect class="pill" x="570" y="272" width="280" height="48" rx="8"/>
  <text class="lab" x="710" y="302" text-anchor="middle" font-size="15">Steps/mm $100–$102</text>
  <rect class="pill" x="570" y="334" width="280" height="48" rx="8"/>
  <text class="lab" x="710" y="364" text-anchor="middle" font-size="15">Soft travel (also step 4)</text>
</svg>
