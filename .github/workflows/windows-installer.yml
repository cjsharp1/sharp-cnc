# Build SharpCNC Windows NSIS (+ MSI) installers on a Windows runner.
# Manual dispatch always; tags v* also publish a GitHub Release with the artifacts.
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build NSIS + MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri Windows bundles
        run: npm run tauri -- build --bundles nsis,msi

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          if (-not $nsis) { throw "NSIS installer not found" }
          Copy-Item $nsis.FullName dist-installer/
          if ($msi) { Copy-Item $msi.FullName dist-installer/ }
          Get-ChildItem dist-installer | Format-Table Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/*
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*
          generate_release_notes: true
          body: |
            SharpCNC Windows desktop installer (Tauri).

            - Prefer the **NSIS** `.exe` setup for a normal install.
            - MSI is optional for managed installs.
            - Unsigned personal builds may show a SmartScreen warning — use *More info → Run anyway* on machines you trust.
            - Getting started: https://cjsharp1.github.io/sharp-cnc/#download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
