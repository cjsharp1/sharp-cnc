# Build SharpCNC Windows NSIS (+ MSI) installers on a Windows runner.
# Manual dispatch always; tags v* create a draft GitHub Release with the
# artifacts, then publish (undraft) only after the upload succeeds —
# never leave a source-only published Release.
#
# In-app updater (tauri-plugin-updater) needs:
# - repo secret TAURI_SIGNING_PRIVATE_KEY (minisign private key body)
# - optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if key has no password)
# Release assets: SharpCNC_*_x64-setup.exe, .exe.sig, latest.json
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build NSIS + MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Require updater signing key on tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY — required to sign updater artifacts for in-app updates."
            exit 1
          fi

      - name: Build Tauri Windows bundles
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY not set — build may fail because createUpdaterArtifacts is enabled. Add the repo secret for signed updates."
          }
          npm run tauri -- build --bundles nsis,msi

      - name: Collect installer + updater artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $msiDir = "src-tauri/target/release/bundle/msi"
          $nsis = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "*.sig" } |
            Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          Copy-Item $nsis.FullName dist-installer/
          $sig = Get-Item -Path ($nsis.FullName + ".sig") -ErrorAction SilentlyContinue
          if ($sig) { Copy-Item $sig.FullName dist-installer/ }
          $msi = Get-ChildItem -Path $msiDir -Filter "*.msi" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "*.sig" } |
            Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName dist-installer/
            $msiSig = Get-Item -Path ($msi.FullName + ".sig") -ErrorAction SilentlyContinue
            if ($msiSig) { Copy-Item $msiSig.FullName dist-installer/ }
          }
          Get-ChildItem dist-installer | Format-Table Name, Length

      - name: Build latest.json updater manifest (tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          nsis="$(ls dist-installer/*-setup.exe | head -1)"
          base="$(basename "$nsis")"
          sig="dist-installer/${base}.sig"
          if [ ! -f "$sig" ]; then
            echo "::error::Missing ${base}.sig — signing key required for in-app updates"
            exit 1
          fi
          url="https://github.com/${REPO}/releases/download/${TAG}/${base}"
          node scripts/generate-updater-latest-json.mjs \
            --version "$version" \
            --nsis-url "$url" \
            --sig-file "$sig" \
            --notes "SharpCNC ${TAG}" \
            --out dist-installer/latest.json
          cat dist-installer/latest.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/*
          if-no-files-found: error

      # Draft first so /releases never shows a source-only published cut.
      - name: Attach installers to draft GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-installer/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            SharpCNC Windows desktop installer (Tauri).

            - Prefer **Menu → About & updates → Install update & relaunch** once you are already on a build that includes the in-app updater.
            - Fresh PC / first hop: run the **NSIS** `.exe` setup (`SharpCNC_*_x64-setup.exe`).
            - Updater assets: `latest.json` + `.exe.sig` (Tauri minisign — not Windows Authenticode).
            - MSI is optional for managed installs.
            - Unsigned personal builds may show a SmartScreen warning — use *More info → Run anyway* on machines you trust.
            - Getting started: https://cjsharp1.github.io/sharp-cnc/#download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release after assets attached (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ASSETS="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(",")')"
          echo "Release assets: $ASSETS"
          echo "$ASSETS" | grep -qi '\.exe' || {
            echo "Refusing to publish: no .exe asset on $TAG"
            exit 1
          }
          echo "$ASSETS" | grep -qi 'latest\.json' || {
            echo "Refusing to publish: no latest.json (in-app updater) on $TAG"
            exit 1
          }
          echo "$ASSETS" | grep -qi '\.sig' || {
            echo "Refusing to publish: no .sig signature on $TAG"
            exit 1
          }
          gh release edit "$TAG" --draft=false
          echo "Published $TAG"
