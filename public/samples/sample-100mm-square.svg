<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100mm"
     height="100mm"
     viewBox="0 0 100 100"
     role="img"
     aria-labelledby="title desc">
  <!--
    SharpCNC cut-size sample — true 100 × 100 mm square.
    width/height use mm; viewBox is 0 0 100 100 so 1 user unit = 1 mm.
    Load in SharpCNC → Job → SVG → Generate → Prepare → cut → measure.
  -->
  <title id="title">SharpCNC 100×100 mm square</title>
  <desc id="desc">Closed 100 mm square for verifying cut size and steps/mm after calibration.</desc>
  <rect x="0" y="0" width="100" height="100"
        fill="none" stroke="#111" stroke-width="0.25"/>
</svg>
